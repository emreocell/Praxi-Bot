[package]
name = "skills"
description = "Markdown skill system: SKILL.md format, layered sources, prompt index and skill tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
fs4 = "1"
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile.workspace = true
thiserror.workspace = true
tool-registry = { path = "../tool-registry", version = "0.1.0" }
unicode-normalization = "0.1.26"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
