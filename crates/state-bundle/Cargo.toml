version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core", version = "0.1.0" }
daemon-api = { path = "../daemon-api", version = "0.1.0" }
permission-engine = { path = "../permission-engine", version = "0.1.0" }
protocol.workspace = true
storage.workspace = true
secret-store.workspace = true
scheduler = { path = "../scheduler", version = "0.1.0" }
memory-store = { path = "../memory-store", version = "0.1.0" }
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tempfile.workspace = true
toml.workspace = true
tar = "0.4"
sha2 = "0.10"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tool-registry = { path = "../tool-registry", version = "0.1.0" }
