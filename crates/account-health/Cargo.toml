[package]
name = "account-health"
description = "Daily probes for bot site accounts, mail identities and Composio app sessions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
