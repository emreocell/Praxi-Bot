[package]
name = "connector-email"
description = "E-mail connector: IMAP read (folders, search, fetch, mark read) and SMTP send/draft tools with TLS required and secret-reference credentials."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait.workspace = true
futures-util.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
mail-parser = "1"
protocol.workspace = true
rustls-pemfile = "2"
secret-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tool-registry = { path = "../tool-registry", version = "0.1.0" }
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
