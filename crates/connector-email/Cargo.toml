[package]
name = "connector-email"
description = "E-mail connector: IMAP read (folders, search, fetch, mark read) and SMTP send/draft tools with TLS required and secret-reference credentials."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait.workspace = true
futures-util.workspace = true
email_address = "0.2"
mail-builder = { version = "0.4", default-features = false }
mail-send = { version = "0.5", default-features = false, features = ["ring", "tls12"] }
mail-parser = "0.11"
log = "0.4"
protocol.workspace = true
secret-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tool-registry = { path = "../tool-registry", version = "0.1.0" }
webpki-roots = "1"

[dev-dependencies]
toml = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
