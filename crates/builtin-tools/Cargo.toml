[package]
name = "builtin-tools"
description = "Built-in agent tools: desktop, browser, files, shell, script and meta tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
browser-cdp = { path = "../browser-cdp", version = "0.1.0" }
connector-email = { path = "../connector-email", version = "0.1.0" }
desktop-api = { path = "../desktop-api", version = "0.1.0" }
globset.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
parking_lot.workspace = true
permission-engine = { path = "../permission-engine", version = "0.1.0" }
# Copied locally from mcp-bridge (do not share the helper yet): Unix process
# group + killpg, Windows job object. Kill-on-close is intentionally not
# enabled; tree kill is TerminateJobObject / killpg while the call is armed.
process-wrap = { version = "10.0.1", features = ["tokio1"] }
protocol.workspace = true
script-runtime = { path = "../script-runtime", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
storage.workspace = true
tokio.workspace = true
tool-registry = { path = "../tool-registry", version = "0.1.0" }
tracing = "0.1"
uuid.workspace = true
vision = { path = "../vision", version = "0.1.0" }
web-tools = { path = "../web-tools", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
secret-store.workspace = true
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
desktop-windows = { path = "../desktop-windows", version = "0.1.0" }
