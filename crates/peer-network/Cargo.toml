[package]
name = "peer-network"
description = "Peer networking over iroh: key-based pairing, JSON-RPC desktop control, events, and a remote DesktopBackend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
desktop-api = { path = "../desktop-api", version = "0.1.0" }
async-trait.workspace = true
base64.workspace = true
data-encoding = "2"
iroh = "1.4"
parking_lot.workspace = true
qrcode = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
# Verify the effective owner and open without following symlinks, using safe APIs.
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# Set the DACL at CreateFileW time and verify security on the opened handle.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "core"
path = "examples/core.rs"
