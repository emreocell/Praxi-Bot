[package]
name = "daemon-api"
description = "Local HTTP + SSE daemon API (axum) in front of the agent loop; embeddable, `bot serve` just runs it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Deterministic echo provider (also used by the tests).
fake-provider = []
local-embeddings = ["memory-store/local-embeddings"]

[lints]
workspace = true

[dependencies]
workflow-replay = { path = "../workflow-replay", version = "0.1.0" }
base64.workspace = true
cap-fs-ext = "4.0.3"
peer-network = { path = "../peer-network", version = "0.1.0" }
process-guard = { path = "../process-guard", version = "0.1.0" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
browser-cdp = { path = "../browser-cdp", version = "0.1.0" }
tempfile.workspace = true
live-view = { workspace = true, features = ["openapi"] }
agent-core = { path = "../agent-core", version = "0.1.0" }
async-trait.workspace = true
builtin-tools = { path = "../builtin-tools", version = "0.1.0" }
memory-store = { path = "../memory-store", version = "0.1.0" }
tool-registry = { path = "../tool-registry", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
desktop-api = { path = "../desktop-api", version = "0.1.0" }
cli-provider.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
futures.workspace = true
fs4 = "1"
getrandom = "0.3"
globset.workspace = true
iana-time-zone = "0.1"
parking_lot.workspace = true
percent-encoding.workspace = true
rusqlite.workspace = true
permission-engine = { path = "../permission-engine", version = "0.1.0" }
protocol.workspace = true
provider-catalog = { path = "../provider-catalog", version = "0.1.0" }
secret-store.workspace = true
scheduler = { path = "../scheduler", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
skills = { path = "../skills", version = "0.1.0" }
storage.workspace = true
task-runtime = { path = "../task-runtime", version = "0.1.0" }
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
utoipa = { version = "5", features = ["uuid"] }
uuid.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "pty", "termios", "std"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
base64.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
http-body-util = "0.1"
tempfile.workspace = true
wiremock.workspace = true
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "daemon-cli-fixture"
path = "../cli-provider/tests/fixtures/runtime_cli.rs"

[[bin]]
name = "daemon-login-fixture"
path = "tests/fixtures/login.rs"

[[bin]]
name = "daemon-install-fixture"
path = "tests/fixtures/install.rs"
