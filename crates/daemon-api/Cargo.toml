[package]
name = "daemon-api"
description = "Local HTTP + SSE daemon API (axum) in front of the agent loop; embeddable, `bot serve` just runs it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Deterministic echo provider (also used by the tests).
fake-provider = []

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core", version = "0.1.0" }
async-trait.workspace = true
desktop-api = { path = "../desktop-api", version = "0.1.0" }
cli-provider.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
futures.workspace = true
getrandom = "0.3"
parking_lot.workspace = true
permission-engine = { path = "../permission-engine", version = "0.1.0" }
protocol.workspace = true
provider-catalog = { path = "../provider-catalog", version = "0.1.0" }
secret-store.workspace = true
scheduler = { path = "../scheduler", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
storage.workspace = true
task-runtime = { path = "../task-runtime", version = "0.1.0" }
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
utoipa = { version = "5", features = ["uuid"] }
uuid.workspace = true

[dev-dependencies]
builtin-tools = { path = "../builtin-tools", version = "0.1.0" }
http-body-util = "0.1"
tempfile.workspace = true
tool-registry = { path = "../tool-registry", version = "0.1.0" }
workflow-replay = { path = "../workflow-replay", version = "0.1.0" }
tower = { version = "0.5", features = ["util"] }
