[package]
name = "cli-provider"
description = "Detection and execution of locally installed coding CLIs (Claude, Codex, Cursor, etc.)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tempfile.workspace = true
uuid.workspace = true
axum = "0.8"
tool-registry = { path = "../tool-registry", version = "0.1.0" }
process-wrap = { version = "10.0.1", features = ["tokio1"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[[bin]]
name = "fake-cli"
path = "tests/fixtures/fake_cli.rs"

[[bin]]
name = "runtime-cli-fixture"
path = "tests/fixtures/runtime_cli.rs"
