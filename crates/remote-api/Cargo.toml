[package]
name = "remote-api"
description = "Paired daemon HTTP API over iroh and authenticated loopback proxy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
server = ["dep:daemon-api"]

[lints]
workspace = true

[dependencies]
peer-network = { path = "../peer-network", version = "0.1.0" }
daemon-api = { path = "../daemon-api", version = "0.1.0", optional = true }
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-util.workspace = true
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
iroh = "1.4"
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
url.workspace = true

[dev-dependencies]
agent-core = { path = "../agent-core", version = "0.1.0" }
daemon-api = { path = "../daemon-api", version = "0.1.0", features = ["fake-provider"] }
reqwest.workspace = true
storage.workspace = true
tempfile.workspace = true
tool-registry = { path = "../tool-registry", version = "0.1.0" }
