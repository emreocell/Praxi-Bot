[package]
name = "script-runtime"
description = "Embedded script interpreter sandbox for code-as-action execution."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
parking_lot.workspace = true
rquickjs = { version = "0.14", default-features = false, features = ["futures", "parallel"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros", "rt-multi-thread", "test-util"] }
