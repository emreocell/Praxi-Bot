[package]
name = "windows-sandbox-spike"
description = "Opt-in, standalone Windows command confinement experiment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
windows-sandbox = ["dep:windows", "dep:uuid"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
uuid = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "run-command"
required-features = ["windows-sandbox"]
