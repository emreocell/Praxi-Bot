# Google Gemini — native Gemini API (streamGenerateContent).
# Source: https://ai.google.dev/gemini-api/docs
# Prices: USD per million tokens, standard paid tier, text input, as of
# prices_as_of. cached_per_mtok is the context-cache read price. Models with
# prompt-size tiers or scheduled price changes carry no price here; storage
# fees for explicit caches are not modelled. Use the models endpoint for the
# live model list.
id = "gemini"
kind = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
auth = { ApiKeyEnv = "GEMINI_API_KEY" }
models_endpoint = "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000"

[capabilities]
tools = true
vision = true
streaming = true
json_mode = true

[compat_flags]

[[models]]
id = "gemini-3.1-flash-lite"
input_per_mtok = 0.25
output_per_mtok = 1.50
cached_per_mtok = 0.025
prices_as_of = "2026-11-07"

[[models]]
id = "gemini-2.5-flash-lite"
input_per_mtok = 0.10
output_per_mtok = 0.40
cached_per_mtok = 0.01
prices_as_of = "2026-11-07"

[[models]]
id = "gemini-3-flash-preview"
input_per_mtok = 0.50
output_per_mtok = 3.00
cached_per_mtok = 0.05
prices_as_of = "2026-11-07"

[[models]]
id = "gemini-3.1-pro-preview"
