# Ollama — local model runner with an OpenAI-compatible endpoint.
# Source: https://github.com/ollama/ollama/blob/main/docs/openai.md
id = "ollama"
kind = "open_ai_compatible"
base_url = "http://localhost:11434/v1"
auth = "None"
models_endpoint = "http://localhost:11434/v1/models"

[capabilities]
tools = true
vision = false
streaming = true
json_mode = false

[compat_flags]
strip_system_role = false
