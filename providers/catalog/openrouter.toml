# OpenRouter — routes to many upstream providers via a single OpenAI-compatible endpoint.
# Source: https://openrouter.ai/docs
id = "openrouter"
kind = "open_ai_compatible"
base_url = "https://openrouter.ai/api/v1"
auth = { ApiKeyEnv = "OPENROUTER_API_KEY" }
models_endpoint = "https://openrouter.ai/api/v1/models"

[capabilities]
tools = true
vision = true
streaming = true
json_mode = true

[compat_flags]
strip_system_role = false
