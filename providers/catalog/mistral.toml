# Mistral AI — OpenAI-compatible chat and coding models API.
# Sources:
#   https://docs.mistral.ai/api
#   https://docs.mistral.ai/models
# A Le Chat chat subscription is NOT an API key: keys come from La Plateforme
#   (https://console.mistral.ai/api-keys).
# Auth: HTTP Bearer token from MISTRAL_API_KEY (`Authorization: Bearer <key>`).
# Rate limits: workspace-scoped RPS/RPM, TPM and monthly token caps scaled by
# billing tier (Free Mode through Tier 4+). Responses include
# `X-RateLimit-Remaining` headers and return HTTP 429 when exceeded; check
# the Mistral Admin Panel Limits page for your workspace quotas.
id = "mistral"
kind = "open_ai_compatible"
base_url = "https://api.mistral.ai/v1"
auth = { ApiKeyEnv = "MISTRAL_API_KEY" }
models_endpoint = "https://api.mistral.ai/v1/models"

[capabilities]
tools = true
vision = true
streaming = true
json_mode = true

[compat_flags]
strip_system_role = false
# La Plateforme rejects tool-call ids that are not exactly 9 letters/digits.
short_tool_call_ids = true

[[models]]
id = "mistral-large-latest"

[[models]]
id = "mistral-medium-latest"

[[models]]
id = "mistral-small-latest"

[[models]]
id = "codestral-latest"

[[models]]
id = "pixtral-large-latest"
