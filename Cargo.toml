    "crates/live-view",
    "crates/host-provision",
    "crates/agent-core",
    "crates/agent-router",
    "crates/tool-registry",
    "crates/permission-engine",
    "crates/protocol",
    "crates/desktop-api",
    "crates/desktop-windows",
    "crates/desktop-linux",
    "crates/desktop-macos",
    "crates/browser-cdp",
    "crates/vision",
    "crates/provider-catalog",
    "crates/cli-provider",
    "crates/computer-target",
    "crates/mcp-bridge",
    "crates/assistant-import",
    "crates/workflow-replay",
    "crates/memory-store",
    "crates/task-runtime",
    "crates/channel-api",
    "crates/channel-telegram",
    "crates/channel-discord",
    "crates/peer-network",
    "crates/remote-api",
    "crates/script-runtime",
    "crates/builtin-tools",
    "crates/doc-tools",
    "crates/dev-tools",
    "crates/plugin-host",
    "crates/storage",
    "crates/state-bundle",
    "crates/skills",
    "crates/evals",
    "crates/secret-store",
    "crates/scheduler",
    "crates/daemon-api",
    "crates/connector-email",
    "crates/connector-homeassistant",
    "crates/connector-calendar",
    "crates/web-tools",
    "crates/openapi-tools",
    "crates/composio",
    "crates/process-guard",
    "crates/pty-session",
    "crates/missions",
    "crates/embedding-hub",
    "apps/cli",
    "apps/desktop",
    "apps/node-agent",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/emreocell/Praxi-Bot"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
live-view = { path = "crates/live-view", version = "0.1.0" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
tokio-tungstenite = "0.26"
futures = "0.3"
globset = "0.4"
image-webp = "0.2"
jpeg-encoder = "0.7"
parking_lot = "0.12"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
schemars = { version = "0.8", features = ["uuid1"] }
thiserror = "2"
toml = "1.2.3"
windows = "0.62"
directories = "5"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
tempfile = "3"
tokio-util = "0.7"
percent-encoding = "2"
url = "2"
serde_yaml_ng = "0.10"
protocol = { path = "crates/protocol", version = "0.1.0" }
cli-provider = { path = "crates/cli-provider", version = "0.1.0" }
storage = { path = "crates/storage", version = "0.1.0" }
secret-store = { path = "crates/secret-store", version = "0.1.0" }
wiremock = "0.6"
uuid = { version = "1", features = ["v7", "serde"] }
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio", "zbus"] }
x11rb = { version = "0.14", features = ["xtest", "randr"] }

# Debug builds and test binaries keep file:line information (panic backtraces, `RUST_BACKTRACE`)
# but not the full PDB type information. On Windows the MSVC linker's peak memory is dominated by
# that type information (a cli-provider test binary linked with ~3.1 GB at the default `debug = true`
# and ~0.5 GB with this setting), and the target directory shrinks by about a third. CI already
# builds this way (`CARGO_PROFILE_DEV_DEBUG` in .github/workflows/ci.yml). `[profile.test]` inherits
# from `dev`. To get full debugger variable inspection locally, build with
# `CARGO_PROFILE_DEV_DEBUG=true cargo build`. The release profile is untouched.
[profile.dev]
debug = "line-tables-only"

# The secret vault derives its key with Argon2id (19 MiB, 2 passes) on every read. At opt-level 0
# that takes seconds, so a daemon built for tests (the real-app smoke, `cargo test`) stalled on
# `GET /v1/providers`, which re-reads the vault once per provider. Optimise only the KDF crates.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
