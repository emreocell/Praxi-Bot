[workspace]
resolver = "3"
members = [
    "crates/agent-core",
    "crates/agent-router",
    "crates/tool-registry",
    "crates/permission-engine",
    "crates/protocol",
    "crates/desktop-api",
    "crates/desktop-windows",
    "crates/desktop-linux",
    "crates/desktop-macos",
    "crates/browser-cdp",
    "crates/vision",
    "crates/provider-catalog",
    "crates/mcp-bridge",
    "crates/workflow-replay",
    "crates/memory-store",
    "crates/task-runtime",
    "crates/channel-api",
    "crates/peer-network",
    "crates/script-runtime",
    "crates/plugin-host",
    "crates/storage",
    "apps/cli",
    "apps/desktop",
    "apps/node-agent",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/emreocell/Praxi-Bot"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
globset = "0.4"
parking_lot = "0.12"
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
