[workspace]
resolver = "3"
members = [
    "crates/agent-core",
    "crates/agent-router",
    "crates/tool-registry",
    "crates/permission-engine",
    "crates/protocol",
    "crates/desktop-api",
    "crates/desktop-windows",
    "crates/desktop-linux",
    "crates/desktop-macos",
    "crates/browser-cdp",
    "crates/vision",
    "crates/provider-catalog",
    "crates/mcp-bridge",
    "crates/workflow-replay",
    "crates/memory-store",
    "crates/task-runtime",
    "crates/channel-api",
    "crates/channel-telegram",
    "crates/peer-network",
    "crates/script-runtime",
    "crates/builtin-tools",
    "crates/dev-tools",
    "crates/plugin-host",
    "crates/storage",
    "crates/skills",
    "crates/evals",
    "crates/secret-store",
    "crates/scheduler",
    "crates/daemon-api",
    "apps/cli",
    "apps/desktop",
    "apps/node-agent",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/emreocell/Praxi-Bot"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
tokio-tungstenite = "0.26"
futures = "0.3"
globset = "0.4"
jpeg-encoder = "0.7"
parking_lot = "0.12"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
schemars = { version = "0.8", features = ["uuid1"] }
thiserror = "2"
toml = "0.8"
windows = "0.62"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio-util = "0.7"
protocol = { path = "crates/protocol", version = "0.1.0" }
storage = { path = "crates/storage", version = "0.1.0" }
secret-store = { path = "crates/secret-store", version = "0.1.0" }
wiremock = "0.6"
uuid = { version = "1", features = ["v7", "serde"] }
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio", "zbus"] }
x11rb = { version = "0.14", features = ["xtest", "randr"] }
