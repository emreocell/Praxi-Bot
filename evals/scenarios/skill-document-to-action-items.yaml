name: skill-document-to-action-items
description: "Starter skill document-to-action-items: the bot loads it with skill_read for a matching request, no approval is needed to read a skill, and the text reaches the next model call."
policy: approve_destructive
tools:
  - { name: skill_read, effect: read, category: fs, output: "# document-to-action-items
Turn a document into cited facts and proposed tasks." }
user: "Extract the deadlines from this contract and list who must do what."
script:
  - tool_calls: [{ id: c1, tool: skill_read, args: { name: document-to-action-items } }]
  - text: "I followed the document-to-action-items skill."
expect:
  state: succeeded
  model_calls: 2
  tool_calls: [skill_read]
  tool_runs: { skill_read: 1 }
  no_approval_tools: [skill_read]
  permissions:
    - { tool: skill_read, decision: allowed }
  requests:
    - { request: 1, tool_messages_contain: ["document-to-action-items", "Turn a document into cited facts and proposed tasks"] }
