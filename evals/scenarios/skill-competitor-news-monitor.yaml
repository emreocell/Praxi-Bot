name: skill-competitor-news-monitor
description: "Starter skill competitor-news-monitor: the bot loads it with skill_read for a matching request, no approval is needed to read a skill, and the text reaches the next model call."
policy: approve_destructive
tools:
  - { name: skill_read, effect: read, category: fs, output: "# competitor-news-monitor
Follow a fixed list of companies." }
user: "Monitor these three competitors and send me a weekly digest."
script:
  - tool_calls: [{ id: c1, tool: skill_read, args: { name: competitor-news-monitor } }]
  - text: "I followed the competitor-news-monitor skill."
expect:
  state: succeeded
  model_calls: 2
  tool_calls: [skill_read]
  tool_runs: { skill_read: 1 }
  no_approval_tools: [skill_read]
  permissions:
    - { tool: skill_read, decision: allowed }
  requests:
    - { request: 1, tool_messages_contain: ["competitor-news-monitor", "Follow a fixed list of companies"] }
