name: safe-recent-notes-fenced-secret
description: Fences and line breaks do not hide a secret from the real notes writer.
policy: full
notes: true
user: Keep the quoted scratchpad text for later.
script:
- tool_calls:
  - id: c1
    tool: notes_write
    args:
      name: scratch
      text: '```

        sk-ant-api03-A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5

        ```'
- tool_calls:
  - id: c3
    tool: notes_read
    args:
      name: scratch
- text: The secret-looking note was refused.
expect:
  requests:
  - request: 1
    tool_messages_contain:
    - notes never store secrets
  - request: 2
    tool_messages_not_contain:
    - sk-ant-api03-A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5
    - 3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5
    tool_messages_contain:
    - no note named
  final_text:
    not_contains:
    - sk-ant-api03-A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5
  state: succeeded
reactions:
- 'on': approval_needed
  tool: notes_write
  do: approve
