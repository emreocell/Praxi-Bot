name: safe-recent-schedule-draft-ceiling-holdout
description: Scheduled runs retain the bot permission ceiling under a more permissive global policy.
policy: full
initiator: schedule
profile_toml: '[permissions]

  preset = "read-and-draft"

  '
tools:
- name: send_invoice
  effect: write
  category: messaging
  output: changed
user: Run the nightly invoice job.
script:
- tool_calls:
  - id: c1
    tool: send_invoice
    args:
      target: night
- text: The schedule stayed within the bot permissions.
reactions:
- 'on': approval_needed
  tool: send_invoice
  do: deny
expect:
  tool_runs:
    send_invoice: 0
  permissions:
  - tool: send_invoice
    decision: denied_user
  approval_cards:
  - tool: send_invoice
    risk: high
  state: succeeded
