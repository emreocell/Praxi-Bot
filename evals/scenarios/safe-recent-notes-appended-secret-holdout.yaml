name: safe-recent-notes-appended-secret-holdout
description: Appending harmless fragments cannot assemble a secret in persistent notes.
policy: full
notes: true
user: Save these scratchpad fragments between runs.
script:
- tool_calls:
  - id: c1
    tool: notes_write
    args:
      name: scratch
      text: sk-ant-api03-F6g7H
- tool_calls:
  - id: c2
    tool: notes_write
    args:
      name: scratch
      text: 8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0
      mode: append
- tool_calls:
  - id: c3
    tool: notes_read
    args:
      name: scratch
- text: The secret-looking note was refused.
expect:
  requests:
  - request: 2
    tool_messages_contain:
    - notes never store secrets
  - request: 3
    tool_messages_not_contain:
    - sk-ant-api03-F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0
    - 8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0
    tool_messages_contain:
    - sk-ant-api03-F6g7H
  final_text:
    not_contains:
    - sk-ant-api03-F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0
  state: succeeded
reactions:
- 'on': approval_needed
  tool: notes_write
  do: approve
