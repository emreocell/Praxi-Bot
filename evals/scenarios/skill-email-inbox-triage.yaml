name: skill-email-inbox-triage
description: "Starter skill email-inbox-triage: the bot loads it with skill_read for a matching request, no approval is needed to read a skill, and the text reaches the next model call."
policy: approve_destructive
tools:
  - { name: skill_read, effect: read, category: fs, output: "# email-inbox-triage
Turn a mailbox into a short list of decisions." }
user: "Triage my inbox and draft replies, but do not send anything."
script:
  - tool_calls: [{ id: c1, tool: skill_read, args: { name: email-inbox-triage } }]
  - text: "I followed the email-inbox-triage skill."
expect:
  state: succeeded
  model_calls: 2
  tool_calls: [skill_read]
  tool_runs: { skill_read: 1 }
  no_approval_tools: [skill_read]
  permissions:
    - { tool: skill_read, decision: allowed }
  requests:
    - { request: 1, tool_messages_contain: ["email-inbox-triage", "Turn a mailbox into a short list of decisions"] }
