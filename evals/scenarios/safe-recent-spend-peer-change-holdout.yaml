name: safe-recent-spend-peer-change-holdout
description: A paired desktop cannot clear limits, even with a forged owner header; the unchanged cap
  stops the run.
policy: full
bot_limits:
  weekly:
    hard_tokens: 1
peer_limit_attempt: true
tools:
- name: paid_action
  effect: write
  output: second effect
user: Keep processing the remaining queue.
script:
- text: The alternate provider reply must never be requested.
  tool_calls:
  - id: c1
    tool: paid_action
    args: {}
expect:
  state: failed
  model_calls: 1
  tool_runs:
    paid_action: 0
  error:
    contains:
    - bot_limit_reached
