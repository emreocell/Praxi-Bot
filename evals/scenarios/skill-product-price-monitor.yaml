name: skill-product-price-monitor
description: "Starter skill product-price-monitor: the bot loads it with skill_read for a matching request, no approval is needed to read a skill, and the text reaches the next model call."
policy: approve_destructive
tools:
  - { name: skill_read, effect: read, category: fs, output: "# product-price-monitor
Watch one exact item and alert on a clear condition." }
user: "Alert me when this laptop drops below 900 euros."
script:
  - tool_calls: [{ id: c1, tool: skill_read, args: { name: product-price-monitor } }]
  - text: "I followed the product-price-monitor skill."
expect:
  state: succeeded
  model_calls: 2
  tool_calls: [skill_read]
  tool_runs: { skill_read: 1 }
  no_approval_tools: [skill_read]
  permissions:
    - { tool: skill_read, decision: allowed }
  requests:
    - { request: 1, tool_messages_contain: ["product-price-monitor", "Watch one exact item and alert on a clear condition"] }
