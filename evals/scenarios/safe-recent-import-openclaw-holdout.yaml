name: safe-recent-import-openclaw-holdout
description: 'The CLI companion test feeds this config to the real import planner: the server arrives
  disabled and secrets become vault references. Tier 1 also refuses a guessed call from source JSON.'
policy: full
fs:
  files:
    .openclaw/mcp-servers.json: '{"mcpServers": {"review-openclaw": {"command": "node", "args": ["fixture-server.js"],
      "env": {"API_KEY": "import-fixture-canary-review-openclaw"}, "enabled": true}}}'
user: Inspect the alternate openclaw setup.
secrets:
- import-fixture-canary-review-openclaw
script:
- tool_calls:
  - id: c1
    tool: mcp:review-openclaw/read
    args: {}
- text: The imported server needs owner review before enabling.
expect:
  state: succeeded
  tool_runs:
    mcp:review-openclaw/read: 0
  no_approval_tools:
  - mcp:review-openclaw/read
  requests:
  - request: 0
    tools_not_offered:
    - mcp:review-openclaw/read
  - request: 1
    tool_messages_contain:
    - unknown tool
  final_text:
    not_contains:
    - import-fixture-canary-review-openclaw
