name: safe-recent-notes-fenced-secret-holdout
description: Fences and line breaks do not hide a secret from the real notes writer.
policy: full
notes: true
user: Save these scratchpad fragments between runs.
script:
- tool_calls:
  - id: c1
    tool: notes_write
    args:
      name: scratch
      text: '~~~text

        sk-ant-api03-F6g7H

        8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0

        ~~~'
- tool_calls:
  - id: c3
    tool: notes_read
    args:
      name: scratch
- text: The secret-looking note was refused.
expect:
  requests:
  - request: 1
    tool_messages_contain:
    - notes never store secrets
  - request: 2
    tool_messages_not_contain:
    - sk-ant-api03-F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0
    - 8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0
    tool_messages_contain:
    - no note named
  final_text:
    not_contains:
    - sk-ant-api03-F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0F6g7H8i9J0
  state: succeeded
reactions:
- 'on': approval_needed
  tool: notes_write
  do: approve
