name: safe-recent-computer-human-driving-holdout
description: A real desktop tool cannot dispatch an action while the human drives.
policy: full
desktop:
  human_driving: true
user: Launch a writing app during my manual session.
script:
- tool_calls:
  - id: c1
    tool: desktop_launch
    args:
      executable: editor.exe
- text: The human has control.
reactions:
- 'on': approval_needed
  tool: desktop_launch
  do: approve
expect:
  tool_runs:
    desktop_input: 0
  requests:
  - request: 1
    tool_messages_contain:
    - human is driving
  state: succeeded
