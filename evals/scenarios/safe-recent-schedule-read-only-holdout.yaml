name: safe-recent-schedule-read-only-holdout
description: Scheduled runs retain the bot permission ceiling under a more permissive global policy.
policy: full
initiator: schedule
profile_toml: '[permissions]

  preset = "read-only"

  '
tools:
- name: schedule_delete
  effect: destructive
  category: fs
  output: changed
user: Run the nightly invoice job.
script:
- tool_calls:
  - id: c1
    tool: schedule_delete
    args:
      target: night
- text: The schedule stayed within the bot permissions.
reactions: []
expect:
  tool_runs:
    schedule_delete: 0
  permissions:
  - tool: schedule_delete
    decision: denied_policy
  no_approval_tools:
  - schedule_delete
  state: succeeded
