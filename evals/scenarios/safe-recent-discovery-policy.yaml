name: safe-recent-discovery-policy
description: A bot-level forbidden action remains undiscoverable under a permissive global policy.
deferred_tools: true
policy: full
profile_toml: '[permissions]

  preset = "read-only"

  '
tools:
- name: draft_publish
  effect: write
  category: messaging
  description: Publish private content
user: Look for a draft publisher.
script:
- tool_calls:
  - id: c1
    tool: tool_search
    args:
      query: draft_publish
- tool_calls:
  - id: c2
    tool: tool_describe
    args:
      name: draft_publish
- text: The bot cannot publish.
expect:
  tool_runs:
    draft_publish: 0
  no_approval_tools:
  - draft_publish
  requests:
  - request: 1
    tool_messages_not_contain:
    - Publish private content
    tools_not_offered:
    - draft_publish
  - request: 2
    tools_not_offered:
    - draft_publish
    tool_messages_contain:
    - unknown tool
  state: succeeded
