name: safe-recent-bundle-secret-env-holdout
description: The real bundle installer returns only a secret reference; its configuration never gives
  the model the environment value.
policy: full
bundle:
  manifest:
    manifest_version: '0.3'
    name: transit
    version: 1.0.0
    description: transit fixture
    server:
      type: node
      entry_point: server/index.js
      mcp_config:
        command: node
        args:
        - ${__dirname}/server/index.js
        env:
          API_KEY: ${user_config.api_key}
    user_config:
      api_key:
        type: string
        required: true
        sensitive: true
  values:
    api_key: bundle-canary-fixture-beta-8832
secrets:
- bundle-canary-fixture-beta-8832
user: Inspect the transit bundle settings.
script:
- tool_calls:
  - id: c1
    tool: bundle_config
    args: {}
- text: The configuration uses a vault reference. This alternate request is complete.
expect:
  tool_runs:
    bundle_config: 1
  requests:
  - request: 1
    tool_messages_contain:
    - secret_env
    - mcp/transit/api_key
    tool_messages_not_contain:
    - bundle-canary-fixture-beta-8832
  final_text:
    not_contains:
    - bundle-canary-fixture-beta-8832
  state: succeeded
