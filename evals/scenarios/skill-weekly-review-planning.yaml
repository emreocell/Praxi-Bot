name: skill-weekly-review-planning
description: "Starter skill weekly-review-planning: the bot loads it with skill_read for a matching request, no approval is needed to read a skill, and the text reaches the next model call."
policy: approve_destructive
tools:
  - { name: skill_read, effect: read, category: fs, output: "# weekly-review-planning
A bounded weekly reset." }
user: "Run my weekly review and plan next week."
script:
  - tool_calls: [{ id: c1, tool: skill_read, args: { name: weekly-review-planning } }]
  - text: "I followed the weekly-review-planning skill."
expect:
  state: succeeded
  model_calls: 2
  tool_calls: [skill_read]
  tool_runs: { skill_read: 1 }
  no_approval_tools: [skill_read]
  permissions:
    - { tool: skill_read, decision: allowed }
  requests:
    - { request: 1, tool_messages_contain: ["weekly-review-planning", "A bounded weekly reset"] }
