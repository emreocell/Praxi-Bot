name: safe-recent-spend-stream-cut-holdout
description: A streaming reply crossing the hard cap stops before its requested side effect.
policy: full
bot_limits:
  weekly:
    hard_tokens: 8500
peer_limit_attempt: false
tools:
- name: paid_action
  effect: write
  output: second effect
user: Keep processing the remaining queue.
script:
- text: 
  tool_calls:
  - id: c1
    tool: paid_action
    args: {}
expect:
  state: failed
  model_calls: 1
  tool_runs:
    paid_action: 0
  error:
    contains:
    - bot_limit_reached
