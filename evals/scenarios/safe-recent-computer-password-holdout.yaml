name: safe-recent-computer-password-holdout
description: Live password focus refuses individually approved input before any send.
policy: approve_destructive
desktop:
  password_focus: true
user: Press the tab key in the editor.
script:
- tool_calls:
  - id: c1
    tool: desktop_get_state
    args: {}
- tool_calls:
  - id: c2
    tool: desktop_key
    args:
      keys:
      - Tab
- text: No computer input was sent.
reactions:
- 'on': approval_needed
  tool: desktop_key
  do: approve
expect:
  tool_runs:
    desktop_input: 0
  requests:
  - request: 2
    tool_messages_contain:
    - password_field
  state: succeeded
