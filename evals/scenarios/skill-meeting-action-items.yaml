name: skill-meeting-action-items
description: "Starter skill meeting-action-items: the bot loads it with skill_read for a matching request, no approval is needed to read a skill, and the text reaches the next model call."
policy: approve_destructive
tools:
  - { name: skill_read, effect: read, category: fs, output: "# meeting-action-items
Start from notes or a transcript the user already has." }
user: "Here are my meeting notes, write the action items and who owns them."
script:
  - tool_calls: [{ id: c1, tool: skill_read, args: { name: meeting-action-items } }]
  - text: "I followed the meeting-action-items skill."
expect:
  state: succeeded
  model_calls: 2
  tool_calls: [skill_read]
  tool_runs: { skill_read: 1 }
  no_approval_tools: [skill_read]
  permissions:
    - { tool: skill_read, decision: allowed }
  requests:
    - { request: 1, tool_messages_contain: ["meeting-action-items", "Start from notes or a transcript the user already has"] }
