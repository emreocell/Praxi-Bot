name: safe-recent-schedule-draft-ceiling
description: Scheduled runs retain the bot permission ceiling under a more permissive global policy.
policy: full
initiator: schedule
profile_toml: '[permissions]

  preset = "read-and-draft"

  '
tools:
- name: send_reminder
  effect: write
  category: messaging
  output: sent
user: Run the morning reminder job.
script:
- tool_calls:
  - id: c1
    tool: send_reminder
    args:
      target: morning
- text: The schedule stayed within the bot permissions.
reactions:
- 'on': approval_needed
  tool: send_reminder
  do: deny
expect:
  tool_runs:
    send_reminder: 0
  permissions:
  - tool: send_reminder
    decision: denied_user
  approval_cards:
  - tool: send_reminder
    risk: high
  state: succeeded
