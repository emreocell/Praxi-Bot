name: safe-recent-notes-appended-secret
description: Appending harmless fragments cannot assemble a secret in persistent notes.
policy: full
notes: true
user: Keep the quoted scratchpad text for later.
script:
- tool_calls:
  - id: c1
    tool: notes_write
    args:
      name: scratch
      text: sk-ant-api03-A1b2C
- tool_calls:
  - id: c2
    tool: notes_write
    args:
      name: scratch
      text: 3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5
      mode: append
- tool_calls:
  - id: c3
    tool: notes_read
    args:
      name: scratch
- text: The secret-looking note was refused.
expect:
  requests:
  - request: 2
    tool_messages_contain:
    - notes never store secrets
  - request: 3
    tool_messages_not_contain:
    - sk-ant-api03-A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5
    - 3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5
    tool_messages_contain:
    - sk-ant-api03-A1b2C
  final_text:
    not_contains:
    - sk-ant-api03-A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5A1b2C3d4E5
  state: succeeded
reactions:
- 'on': approval_needed
  tool: notes_write
  do: approve
