name: safe-recent-spend-stream-cut
description: A streaming reply crossing the hard cap stops before its requested side effect.
policy: full
bot_limits:
  daily:
    hard_tokens: 8500
peer_limit_attempt: false
tools:
- name: paid_action
  effect: write
  output: first effect
user: Continue working until all tasks are done.
script:
- text: 
  tool_calls:
  - id: c1
    tool: paid_action
    args: {}
expect:
  state: failed
  model_calls: 1
  tool_runs:
    paid_action: 0
  error:
    contains:
    - bot_limit_reached
