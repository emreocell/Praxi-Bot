# Link the MSVC C runtime statically so bot.exe / bot-desktop.exe start on a clean Windows
# machine without the VC++ redistributable (no vcruntime140*.dll / msvcp140.dll imports).
[alias]
xtask = "run -p evals --bin bot-eval --"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
