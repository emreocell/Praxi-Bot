name: Linux Server Packages

# Deliberately NOT triggered on push/PR: release builds for two architectures
# are slow. Run manually or push a `v*` tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 (glibc 2.35) so the binaries should run on
          # Ubuntu 22.04+ and Debian 12+. Oracle Linux 9 (glibc 2.34) is untested. Native runners, no cross toolchain.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev pkg-config libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build bot and bot-node
        run: cargo build --release --locked --target ${{ matrix.target }} -p cli -p node-agent

      - name: Package tarball
        id: pkg
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          name="praxi-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}/bin"
          for b in bot bot-node; do
            test -x "${out}/${b}"
            strip "${out}/${b}" || true
            install -m 0755 "${out}/${b}" "dist/${name}/bin/${b}"
          done
          install -m 0644 LICENSE NOTICE THIRD_PARTY_NOTICES.md "dist/${name}/"
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA}" > "dist/${name}/VERSION"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          cat "dist/${name}.tar.gz.sha256"

      - name: Smoke test (native)
        run: |
          "dist/praxi-linux-${{ matrix.arch }}/bin/bot" --version
          "dist/praxi-linux-${{ matrix.arch }}/bin/bot-node" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: praxi-linux-${{ matrix.arch }}
          path: |
            dist/praxi-linux-${{ matrix.arch }}.tar.gz
            dist/praxi-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
