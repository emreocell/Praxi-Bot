name: Linux Server Packages

# PRs/main run only lightweight trust checks. Native release builds run for v* tags or by hand.
# Two kinds of tag (see docs/guide/release-linux.md):
#   final       v1.2.3          needs the protected tag + the reviewer-gated `release` environment;
#                               published only by a manual run with dry_run off.
#   pre-release v1.2.3-alpha.1  (any suffix) built, attested, verified and attached to the tag's
#                               pre-release automatically by a single maintainer, no reviewer.
on:
  pull_request:
    paths:
      - ".github/workflows/installer.yml"
      - ".github/workflows/linux-release.yml"
      - "scripts/install-linux.sh"
      - "scripts/linux/tests/test-publish-linux-assets.sh"
      - "scripts/release/**"
      - "scripts/tests/test_check_release_version.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "PRE-RELEASE tag to (re)build and publish Linux assets for (e.g. v0.1.0-alpha.1); empty = the tag this run was started on"
        type: string
        default: ""
      dry_run:
        description: Build, attest and verify without publishing
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/installer.yml"
      - ".github/workflows/linux-release.yml"
      - "scripts/install-linux.sh"
      - "scripts/linux/tests/test-publish-linux-assets.sh"
      - "scripts/release/**"
      - "scripts/tests/test_check_release_version.py"

permissions: {}

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Installer trust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require immutable action pins
        run: |
          python - <<'PYTHON'
          import pathlib, re
          workflow = pathlib.Path(".github/workflows/linux-release.yml").read_text()
          uses = re.findall(r"^\s*(?:-\s*)?uses:\s*(.+)$", workflow, re.MULTILINE)
          assert uses, "no action references found"
          for action in uses:
              assert re.fullmatch(r"[^@\s]+@[0-9a-f]{40}(?:\s+#.*)?", action), action
          print(f"Verified {len(uses)} immutable action references")
          # Build job-level conditions without writing the expression opener literally: GitHub evaluates
          # every dollar-brace pair in a run block, and status functions are not allowed there.
          def job_if(condition):
              return "    if: " + chr(36) + "{{ " + condition + " }}"
          version_check = workflow.split("\n  check-version:\n", 1)[1].split("\n  build:\n", 1)[0]
          build = workflow.split("\n  build:\n", 1)[1].split("\n  attest-prerelease:\n", 1)[0]
          assert "    needs: plan" in version_check
          assert "scripts/release/check_version.py" in version_check
          assert "    needs: [validate, plan, check-version]" in build
          assert "needs.check-version.outputs.checkout_ref" in build
          windows = pathlib.Path(".github/workflows/installer.yml").read_text()
          version_step = windows.split("- name: Check tagged release version", 1)[1].split("- name:", 1)[0]
          assert "if: github.ref_type == 'tag'" in version_step
          assert "scripts/release/check_version.py" in version_step
          assert windows.index("- name: Check tagged release version") < windows.index("- name: Install Rust toolchain")
          # FINAL tags: reviewer-gated attestation and publication, unchanged.
          release = workflow.split("\n  release:\n", 1)[1]
          assert job_if("!cancelled() && needs.verify-tagged-release.result == 'success' && needs.plan.outputs.kind == 'final' && needs.plan.outputs.publish == 'true'") in release
          assert "needs.verify-tagged-release.result == 'success'" in release
          assert "    needs: [plan, check-version, verify-tagged-release]" in release
          assert "    environment: release" in release
          attest = workflow.split("\n  attest:\n", 1)[1].split("\n  verify-tagged-release:\n", 1)[0]
          assert "    environment: release" in attest
          assert "needs.plan.outputs.kind == 'final'" in attest
          assert 'GITHUB_REF_PROTECTED' in attest and 'required_reviewers' in attest
          # PRE-RELEASE tags: no reviewer environment, but the repository, the tag/main ref, the
          # verification job and the no-overwrite publisher are all still required.
          pre = workflow.split("\n  attest-prerelease:\n", 1)[1].split("\n  attest:\n", 1)[0]
          assert "environment:" not in pre
          assert "needs.plan.outputs.kind == 'pre'" in pre
          assert "github.repository == 'emreocell/Praxi-Bot'" in pre
          assert "github.event.repository.fork" in pre and "refs/heads/main" in pre
          publish_pre = workflow.split("\n  publish-prerelease:\n", 1)[1].split("\n  release:\n", 1)[0]
          assert "environment:" not in publish_pre
          assert "    needs: [plan, check-version, verify-tagged-release]" in publish_pre
          assert "needs.plan.outputs.kind == 'pre'" in publish_pre
          assert job_if("!cancelled() && needs.verify-tagged-release.result == 'success' && needs.plan.outputs.kind == 'pre' && needs.plan.outputs.publish == 'true' && github.repository == 'emreocell/Praxi-Bot'") in publish_pre
          assert "needs.verify-tagged-release.result == 'success'" in publish_pre
          assert "publish-linux-assets.sh" in publish_pre and "publish-linux-assets.sh" in release
          assert "needs.check-version.outputs.previous_tag" in publish_pre and "needs.check-version.outputs.previous_tag" in release
          script = pathlib.Path("scripts/release/publish-linux-assets.sh").read_text()
          assert '--clobber' not in script and 'gh release edit' not in script and 'gh release delete' not in script
          # An existing release (the Windows installer is attached first) may gain the Linux assets,
          # but never replace one: names that already exist abort the run.
          assert 'gh release upload' in script and 'refusing to overwrite' in script
          print("Verified final-tag reviewer gate, pre-release gates, real verifier and no-overwrite publisher")
          PYTHON

      - name: Release version checker tests
        run: python -B -m unittest discover -s scripts/tests -p test_check_release_version.py

      - name: Release publisher tests
        if: runner.os == 'Linux'
        run: bash scripts/linux/tests/test-publish-linux-assets.sh

      - name: Audit release workflow
        if: runner.os == 'Linux'
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows/linux-release.yml
          version: 1.32.0
          online-audits: false
          advanced-security: false

      - name: Hermetic installer trust regressions
        if: success() || failure()
        run: |
          set -euo pipefail
          script="${INSTALLER_SCRIPT:-$PWD/scripts/install-linux.sh}"
          bash -n "$script"
          fixture_root="$(mktemp -d)"
          trap 'rm -rf "$fixture_root"' EXIT
          export FIXTURE_ROOT="$fixture_root"
          export FIXTURE_MUTATIONS="$fixture_root/mutations"
          export FIXTURE_CALLS="$fixture_root/verification-calls"
          export FIXTURE_RELEASE="$fixture_root/release fixtures"
          mkdir -p "$fixture_root/bin" "$FIXTURE_RELEASE" "$fixture_root/payload/praxi-linux-x86_64/bin"
          for name in bot bot-node; do
            printf '#!/bin/sh\necho trusted fixture\n' > "$fixture_root/payload/praxi-linux-x86_64/bin/$name"
            chmod +x "$fixture_root/payload/praxi-linux-x86_64/bin/$name"
          done
          asset=praxi-linux-x86_64.tar.gz
          tar -czf "$FIXTURE_RELEASE/$asset" -C "$fixture_root/payload" praxi-linux-x86_64
          sha256sum "$FIXTURE_RELEASE/$asset" > "$FIXTURE_RELEASE/$asset.sha256"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$fixture_root/key.pem" 2>/dev/null
          openssl pkey -in "$fixture_root/key.pem" -pubout -out "$fixture_root/public.pem" 2>/dev/null

          # The gh boundary double authenticates an independently signed fixture and
          # checks the exact policy arguments. This tests installer enforcement, not
          # GitHub/Sigstore's own cryptographic implementation or a live release.
          make_bundle() {
            local output="$1" repo="$2" ref="$3" runner="$4" subject="${5:-$FIXTURE_RELEASE/$asset}" digest
            digest="$(sha256sum "$subject")"
            printf '%s\n' "$repo" \
              github.com/emreocell/Praxi-Bot/.github/workflows/linux-release.yml \
              "$ref" https://token.actions.githubusercontent.com "$runner" \
              https://slsa.dev/provenance/v1 "${digest%% *}" > "$fixture_root/statement"
            cat "$fixture_root/statement" > "$output"
            openssl dgst -sha256 -sign "$fixture_root/key.pem" "$fixture_root/statement" | openssl base64 -A >> "$output"
            printf '\n' >> "$output"
          }
          make_bundle "$FIXTURE_RELEASE/praxi-linux.sigstore.json" emreocell/Praxi-Bot refs/tags/v0.0.0 github-hosted
          make_bundle "$fixture_root/wrong-repo.bundle" attacker/Praxi-Bot refs/tags/v0.0.0 github-hosted
          make_bundle "$fixture_root/wrong-ref.bundle" emreocell/Praxi-Bot refs/tags/v0.0.0-other github-hosted
          make_bundle "$fixture_root/self-hosted.bundle" emreocell/Praxi-Bot refs/tags/v0.0.0 self-hosted
          make_bundle "$fixture_root/main-ref.bundle" emreocell/Praxi-Bot refs/heads/main github-hosted
          mkdir "$fixture_root/attacker"
          printf '#!/bin/sh\necho attacker fixture\n' > "$fixture_root/payload/praxi-linux-x86_64/bin/bot"
          tar -czf "$fixture_root/attacker/$asset" -C "$fixture_root/payload" praxi-linux-x86_64
          sha256sum "$fixture_root/attacker/$asset" > "$fixture_root/attacker/$asset.sha256"
          cp "$FIXTURE_RELEASE/praxi-linux.sigstore.json" "$fixture_root/attacker/praxi-linux.sigstore.json"

          cat > "$fixture_root/bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == --version ]]; then
            printf 'gh version %s (fixture)\n' "${FIXTURE_GH_VERSION:-2.80.0}"
            exit 0
          fi
          printf 'called\n' >> "$FIXTURE_CALLS"
          [[ $# -ge 3 && "$1" == attestation && "$2" == verify ]] || exit 2
          artifact="$3"; shift 3
          declare -A flags=()
          while [[ $# -gt 0 ]]; do
            case "$1" in
              --deny-self-hosted-runners) flags["$1"]=true; shift ;;
              --bundle|--repo|--hostname|--signer-workflow|--source-ref|--cert-oidc-issuer|--predicate-type|--digest-alg|--custom-trusted-root)
                [[ $# -ge 2 && ! -v "flags[$1]" ]] || exit 2
                flags["$1"]="$2"; shift 2 ;;
              *) exit 2 ;;
            esac
          done
          expected_flags=9
          if [[ -v 'flags[--custom-trusted-root]' ]]; then
            expected_flags=10
            cmp -- "${flags[--custom-trusted-root]}" "$FIXTURE_ROOT/trusted_root.jsonl"
          fi
          if [[ "${FIXTURE_NO_NETWORK:-0}" == 1 ]]; then
            [[ -v 'flags[--custom-trusted-root]' ]] || exit 2
          fi
          [[ ${#flags[@]} -eq "$expected_flags" && "${flags[--repo]}" == emreocell/Praxi-Bot ]]
          [[ "${flags[--hostname]}" == github.com && "${flags[--digest-alg]}" == sha256 ]]
          [[ "${flags[--signer-workflow]}" == github.com/emreocell/Praxi-Bot/.github/workflows/linux-release.yml ]]
          [[ "${flags[--cert-oidc-issuer]}" == https://token.actions.githubusercontent.com ]]
          [[ "${flags[--predicate-type]}" == https://slsa.dev/provenance/v1 && "${flags[--deny-self-hosted-runners]}" == true ]]
          head -n 7 "${flags[--bundle]}" > "$FIXTURE_ROOT/verify-statement"
          tail -n 1 "${flags[--bundle]}" | openssl base64 -d -A > "$FIXTURE_ROOT/verify-signature"
          openssl dgst -sha256 -verify "$FIXTURE_ROOT/public.pem" -signature "$FIXTURE_ROOT/verify-signature" "$FIXTURE_ROOT/verify-statement"
          mapfile -t claims < "$FIXTURE_ROOT/verify-statement"
          [[ "${claims[0]}" == "${flags[--repo]}" && "${claims[1]}" == "${flags[--signer-workflow]}" ]]
          [[ "${claims[2]}" == "${flags[--source-ref]}" && "${claims[3]}" == "${flags[--cert-oidc-issuer]}" ]]
          [[ "${claims[4]}" == github-hosted && "${claims[5]}" == "${flags[--predicate-type]}" ]]
          digest="$(sha256sum "$artifact")"
          [[ "${claims[6]}" == "${digest%% *}" ]]
          GH
          cat > "$fixture_root/bin/curl" <<'CURL'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "${FIXTURE_NO_NETWORK:-0}" != 1 ]] || { echo 'unexpected network' >&2; exit 95; }
          output=""; url=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -o) output="$2"; shift 2 ;;
              --proto|--proto-redir|--connect-timeout|--max-time|--write-out) shift 2 ;;
              -fSL|-fsS|--tlsv1.2) shift ;;
              https://*) url="$1"; shift ;;
              *) exit 2 ;;
            esac
          done
          if [[ "$url" == https://github.com/emreocell/Praxi-Bot/releases/latest ]]; then
            # GitHub answers 404 for "latest" while only pre-releases exist.
            [[ "${FIXTURE_LATEST_404:-0}" != 1 ]] || exit 22
            printf '%s' "${FIXTURE_LATEST_URL:-https://github.com/emreocell/Praxi-Bot/releases/tag/v0.0.0}"
          elif [[ "$url" == 'https://api.github.com/repos/emreocell/Praxi-Bot/releases?per_page=1' ]]; then
            printf '%s\n' '[{"tag_name": "v0.0.0", "prerelease": true}]'
          else
            [[ "$url" == https://github.com/emreocell/Praxi-Bot/releases/download/v0.0.0/* ]] || exit 2
            cp -- "$FIXTURE_RELEASE/${url##*/}" "$output"
          fi
          CURL
          cat > "$fixture_root/bin/forbidden" <<'FORBIDDEN'
          #!/usr/bin/env bash
          printf '%s\n' "$0 $*" >> "$FIXTURE_MUTATIONS"
          exit 90
          FORBIDDEN
          chmod +x "$fixture_root/bin/gh" "$fixture_root/bin/curl" "$fixture_root/bin/forbidden"
          for command in apt-get dnf systemctl useradd userdel groupdel snap sudo install tar; do
            cp "$fixture_root/bin/forbidden" "$fixture_root/bin/$command"
          done
          export PATH="$fixture_root/bin:$PATH"
          expect_rejected() {
            local name="$1" message="$2"; shift 2
            if "$@" > "$fixture_root/$name.log" 2>&1; then
              cat "$fixture_root/$name.log"
              echo "FAIL: $name was accepted" >&2
              exit 1
            fi
            grep -Fq -- "$message" "$fixture_root/$name.log" || { cat "$fixture_root/$name.log"; exit 1; }
            echo "PASS: $name rejected before installation"
          }

          bash "$script" --verify-only --version v0.0.0 --file "$FIXTURE_RELEASE/$asset"
          echo 'PASS: signed local fixture accepted'
          bash "$script" --verify-only
          echo 'PASS: latest resolved to a concrete tag and signed download accepted'
          expect_rejected tampered-with-matching-checksum 'provenance verification failed' \
            bash "$script" --verify-only --version v0.0.0 --file "$fixture_root/attacker/$asset"
          grep -Fq 'checksum OK' "$fixture_root/tampered-with-matching-checksum.log"
          for kind in wrong-repo wrong-ref self-hosted; do
            expect_rejected "$kind" 'provenance verification failed' bash "$script" --verify-only \
              --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" --bundle "$fixture_root/$kind.bundle"
          done
          expect_rejected missing-bundle 'provenance bundle not found' bash "$script" --verify-only \
            --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" --bundle "$fixture_root/missing.bundle"
          expect_rejected checksum-is-not-a-bypass "unknown argument '--insecure-skip-verify'" \
            bash "$script" --verify-only --file "$fixture_root/attacker/$asset" --insecure-skip-verify
          expect_rejected unexpected-latest-host 'latest release did not resolve to the expected repository' \
            env FIXTURE_LATEST_URL=https://attacker.invalid/releases/tag/v0.0.0 bash "$script" --verify-only
          mkdir "$fixture_root/no-gh"
          cat > "$fixture_root/no-gh/uname" <<UNAME
          #!$BASH
          printf '%s\n' x86_64
          UNAME
          chmod +x "$fixture_root/no-gh/uname"
          expect_rejected missing-verifier 'trusted GitHub CLI (gh) is required' \
            env PATH="$fixture_root/no-gh" "$BASH" "$script" --verify-only --version v0.0.0 --file "$FIXTURE_RELEASE/$asset"
          [[ ! -e "$FIXTURE_MUTATIONS" ]] || { cat "$FIXTURE_MUTATIONS"; exit 1; }
          # Exercise the exact documented bootstrap, replacing only its example tag.
          bash "$script" --help | awk '/^  \($/ {capture=1} capture {sub(/^  /, ""); print} /^\)$/ {capture=0}' \
            | sed 's/version=v0.1.0/version=v0.0.0/' > "$fixture_root/bootstrap.sh"
          bash -n "$fixture_root/bootstrap.sh"
          cp "$script" "$FIXTURE_RELEASE/install-linux.sh"
          make_bundle "$FIXTURE_RELEASE/praxi-linux.sigstore.json" emreocell/Praxi-Bot refs/tags/v0.0.0 github-hosted \
            "$FIXTURE_RELEASE/install-linux.sh"
          mkdir "$fixture_root/bootstrap-bin"
          cat > "$fixture_root/bootstrap-bin/sudo" <<'SUDO'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "$FIXTURE_ROOT/bootstrap-executed"
          SUDO
          chmod +x "$fixture_root/bootstrap-bin/sudo"
          PATH="$fixture_root/bootstrap-bin:$PATH" bash "$fixture_root/bootstrap.sh"
          [[ -s "$fixture_root/bootstrap-executed" ]]
          rm "$fixture_root/bootstrap-executed"
          printf '# attacker changed installer\n' >> "$FIXTURE_RELEASE/install-linux.sh"
          expect_rejected tampered-bootstrap 'Verified OK' env PATH="$fixture_root/bootstrap-bin:$PATH" \
            bash "$fixture_root/bootstrap.sh"
          [[ ! -e "$fixture_root/bootstrap-executed" && ! -e "$FIXTURE_MUTATIONS" ]]
          [[ "$(wc -l < "$FIXTURE_CALLS")" -eq 8 ]]
          make_bundle "$FIXTURE_RELEASE/praxi-linux.sigstore.json" emreocell/Praxi-Bot refs/tags/v0.0.0 github-hosted
          # Only pre-releases published: "latest" is a 404, the pinned repository's API names the tag.
          env FIXTURE_LATEST_404=1 bash "$script" --verify-only
          echo 'PASS: latest falls back to the newest (pre-)release of the pinned repository'
          # Only the release tag itself is an accepted source ref: provenance of a run on main never stands
          # in for a tag, final or pre-release (an older main build could carry a flaw the tag fixes).
          expect_rejected main-ref-for-a-final-tag 'provenance verification failed' \
            bash "$script" --verify-only --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" \
              --bundle "$fixture_root/main-ref.bundle"
          expect_rejected main-ref-for-a-prerelease-tag 'provenance verification failed' \
            bash "$script" --verify-only --version v0.0.0-pre.1 --file "$FIXTURE_RELEASE/$asset" \
              --bundle "$fixture_root/main-ref.bundle"
          make_bundle "$fixture_root/pre-tag.bundle" emreocell/Praxi-Bot refs/tags/v0.0.0-pre.1 github-hosted
          bash "$script" --verify-only --version v0.0.0-pre.1 --file "$FIXTURE_RELEASE/$asset" \
            --bundle "$fixture_root/pre-tag.bundle"
          echo 'PASS: only the release tag is accepted as provenance source ref (final and pre-release)'
          # Offline verification must pass an explicitly trusted root and cannot
          # reach curl, package managers, services, or extraction.
          printf '{"fixture":"independently acquired root"}\n' > "$fixture_root/trusted_root.jsonl"
          env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline \
            --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" \
            --custom-trusted-root "$fixture_root/trusted_root.jsonl"
          expect_rejected offline-without-explicit-root '--offline requires' \
            env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline \
              --version v0.0.0 --file "$FIXTURE_RELEASE/$asset"
          expect_rejected offline-latest '--offline requires' \
            env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline \
              --file "$FIXTURE_RELEASE/$asset" --custom-trusted-root "$fixture_root/trusted_root.jsonl"
          expect_rejected offline-missing-archive '--offline requires' \
            env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline \
              --version v0.0.0 --custom-trusted-root "$fixture_root/trusted_root.jsonl"
          expect_rejected missing-root 'trusted root file is missing or empty' \
            env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline \
              --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" \
              --custom-trusted-root "$fixture_root/missing-root"
          printf 'untrusted-root' > "$fixture_root/untrusted-root"
          expect_rejected untrusted-root 'provenance verification failed' \
            env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline \
              --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" \
              --custom-trusted-root "$fixture_root/untrusted-root"
          expect_rejected offline-wrong-ref 'provenance verification failed' \
            env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline \
              --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" \
              --bundle "$fixture_root/wrong-ref.bundle" \
              --custom-trusted-root "$fixture_root/trusted_root.jsonl"
          expect_rejected old-verifier 'GitHub CLI >= 2.80.0 is required' \
            env FIXTURE_GH_VERSION=2.79.0 bash "$script" --verify-only --version v0.0.0 \
              --file "$FIXTURE_RELEASE/$asset"
          expect_rejected malformed-verifier 'unrecognized version' \
            env FIXTURE_GH_VERSION=unknown bash "$script" --verify-only --version v0.0.0 \
              --file "$FIXTURE_RELEASE/$asset"
          expect_rejected offline-desktop '--offline cannot download' \
            env FIXTURE_NO_NETWORK=1 bash "$script" --verify-only --offline --with-desktop \
              --version v0.0.0 --file "$FIXTURE_RELEASE/$asset" \
              --custom-trusted-root "$fixture_root/trusted_root.jsonl"
          [[ ! -e "$FIXTURE_MUTATIONS" ]]
          echo 'PASS: explicit-root offline verification and verifier version floor'

          echo 'PASS: verified bootstrap reached sudo only after installer verification'
          echo 'PASS: all identity checks exercised; no network or privileged commands executed'

  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      kind: ${{ steps.p.outputs.kind }}
      build: ${{ steps.p.outputs.build }}
      publish: ${{ steps.p.outputs.publish }}
      checkout_ref: ${{ steps.p.outputs.checkout_ref }}
    steps:
      - name: Decide what this run may do
        id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag=""; kind=none; build=false; publish=false; checkout_ref="$REF"
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ -n "$INPUT_TAG" ]]; then tag="$INPUT_TAG"; elif [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
            build=true
          fi
          if [[ -n "$tag" ]]; then
            [[ "$REPO" == emreocell/Praxi-Bot ]] || { echo 'releases are built only in emreocell/Praxi-Bot' >&2; exit 1; }
            [[ "$tag" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]] || { echo "not a release tag: $tag" >&2; exit 1; }
            build=true
            checkout_ref="refs/tags/$tag"
            if [[ "$tag" == *-* ]]; then
              kind=pre
              # A pre-release is attested by a run on its own tag or, to (re)publish an existing
              # tag whose commit predates this workflow, by a manual run on main.
              [[ "$REF" == "refs/tags/$tag" || ( "$EVENT" == workflow_dispatch && "$REF" == refs/heads/main ) ]] \
                || { echo "a pre-release is built from its tag or by a manual run on main, not from $REF" >&2; exit 1; }
              [[ "$EVENT" == push ]] && publish=true
            else
              kind=final
              [[ "$REF" == "refs/tags/$tag" ]] \
                || { echo "a final release must be started on its own protected tag ($tag), not on $REF" >&2; exit 1; }
            fi
            if [[ "$EVENT" == workflow_dispatch && "$DRY_RUN" != true ]]; then publish=true; fi
          fi
          {
            echo "tag=$tag"; echo "kind=$kind"; echo "build=$build"; echo "publish=$publish"
            echo "checkout_ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag kind=$kind build=$build publish=$publish"

  check-version:
    name: Check release version
    if: needs.plan.outputs.build == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      checkout_ref: ${{ steps.check.outputs.commit || needs.plan.outputs.checkout_ref }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
    steps:
      - name: Checkout workflow source and release tags
        if: needs.plan.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the commit to be built
        if: needs.plan.outputs.tag != ''
        id: check
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_REF: ${{ needs.plan.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          source=.
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            # Rebuilds dispatched from main may target tags that predate the checker.
            commit="$(git rev-parse --verify "$RELEASE_REF^{commit}")"
            source="$RUNNER_TEMP/release-source"
            git worktree add --detach "$source" "$commit"
          fi
          python3 -B scripts/release/check_version.py --root "$source" "$TAG"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          previous_tag="$(git describe --tags --abbrev=0 --always --match 'v[0-9]*' --exclude "$TAG" "$commit")"
          # With no earlier tag, --always returns the commit ID.
          if [[ "$previous_tag" == v* ]]; then
            echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    if: needs.plan.outputs.build == 'true'
    needs: [validate, plan, check-version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35): Ubuntu 22.04+ and Debian 12+.
          # Oracle Linux 9 (glibc 2.34) is untested. Native runners only.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check-version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: A pre-release started from main must be a commit of main
        if: needs.plan.outputs.tag != '' && github.ref_type == 'branch'
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev pkg-config libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          targets: ${{ matrix.target }}

      # Release builds intentionally do not restore mutable dependency/target
      # caches from other workflows before producing signed artifacts.
      - name: Build bot and bot-node
        env:
          TARGET: ${{ matrix.target }}
          # The server reports this tag (`bot --version`, GET /v1/host) so the app can tell
          # which alpha it runs; the cargo version (0.1.0) is the same for all of them.
          PRAXI_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: cargo build --release --locked --target "$TARGET" -p cli -p node-agent

      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          out="target/${TARGET}/release"
          name="praxi-linux-${ARCH}"
          mkdir -p "dist/${name}/bin"
          for b in bot bot-node; do
            test -x "${out}/${b}"
            strip "${out}/${b}" || true
            install -m 0755 "${out}/${b}" "dist/${name}/bin/${b}"
          done
          install -m 0644 LICENSE NOTICE THIRD_PARTY_NOTICES.md "dist/${name}/"
          echo "${TAG:-$GITHUB_REF_NAME} $(git rev-parse HEAD)" > "dist/${name}/VERSION"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          cat "dist/${name}.tar.gz.sha256"

      - name: Smoke test (native)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          "dist/praxi-linux-${ARCH}/bin/bot" --version
          "dist/praxi-linux-${ARCH}/bin/bot-node" --version

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praxi-linux-${{ matrix.arch }}
          path: |
            dist/praxi-linux-${{ matrix.arch }}.tar.gz
            dist/praxi-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  attest-prerelease:
    name: Attest pre-release (no reviewer gate)
    if: needs.plan.outputs.kind == 'pre' && github.repository == 'emreocell/Praxi-Bot'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require this repository, a non-fork run and the tag or main ref
        env:
          FORK: ${{ github.event.repository.fork }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == emreocell/Praxi-Bot && "$FORK" != true ]] \
            || { echo 'pre-releases are attested only from emreocell/Praxi-Bot itself' >&2; exit 1; }
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] \
            || { echo 'pre-releases are never attested for pull requests' >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$TAG" || "$GITHUB_REF" == refs/heads/main ]] \
            || { echo "unexpected ref $GITHUB_REF" >&2; exit 1; }

      - name: Download this run's artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: praxi-linux-*
          merge-multiple: true
          digest-mismatch: error

      - name: Stage the tagged installer
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]
          test -f dist/praxi-linux-x86_64.tar.gz
          test -f dist/praxi-linux-aarch64.tar.gz
          (cd dist && sha256sum --check ./*.sha256)
          install -m 0755 scripts/install-linux.sh dist/install-linux.sh

      # Build jobs have no OIDC/attestation/release-write permission. This job
      # attests only assets from this run and the installer from the same tag.
      - name: Attest archives and installer
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install-linux.sh

      - name: Verify and stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE_PATH" dist/praxi-linux.sigstore.json
          for asset in dist/*.tar.gz dist/install-linux.sh; do
            gh attestation verify "$asset" --bundle dist/praxi-linux.sigstore.json \
              --repo emreocell/Praxi-Bot --hostname github.com \
              --signer-workflow github.com/emreocell/Praxi-Bot/.github/workflows/linux-release.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --predicate-type https://slsa.dev/provenance/v1 --digest-alg sha256
          done

      - name: Upload signed inputs for independent verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praxi-linux-signed-inputs
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest protected release tag
    if: needs.plan.outputs.kind == 'final' && github.repository == 'emreocell/Praxi-Bot'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require tag protection and reviewer approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_PROTECTED" == true ]] || {
            echo 'A protected v* tag is required: add a tag ruleset for refs/tags/v* (Settings > Rules) and push the tag again' >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers" and .prevent_self_review == true) | .reviewers | length] | any(. > 0)' \
            | grep -qx true || {
              echo 'The "release" environment needs a required reviewer other than the person who pushes the tag, with "Prevent self-review" on (Settings > Environments > release)' >&2
              exit 1
            }

      - name: Download this run's artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: praxi-linux-*
          merge-multiple: true
          digest-mismatch: error

      - name: Stage the tagged installer
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]
          test -f dist/praxi-linux-x86_64.tar.gz
          test -f dist/praxi-linux-aarch64.tar.gz
          (cd dist && sha256sum --check ./*.sha256)
          install -m 0755 scripts/install-linux.sh dist/install-linux.sh

      # Build jobs have no OIDC/attestation/release-write permission. This job
      # attests only assets from this run and the installer from the same tag.
      - name: Attest archives and installer
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install-linux.sh

      - name: Verify and stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE_PATH" dist/praxi-linux.sigstore.json
          for asset in dist/*.tar.gz dist/install-linux.sh; do
            gh attestation verify "$asset" --bundle dist/praxi-linux.sigstore.json \
              --repo emreocell/Praxi-Bot --hostname github.com \
              --signer-workflow github.com/emreocell/Praxi-Bot/.github/workflows/linux-release.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --predicate-type https://slsa.dev/provenance/v1 --digest-alg sha256
          done

      - name: Upload signed inputs for independent verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praxi-linux-signed-inputs
          path: dist/*
          if-no-files-found: error

  verify-tagged-release:
    name: Real gh verification (online and offline)
    needs: [plan, attest, attest-prerelease]
    if: ${{ !cancelled() && (needs.attest.result == 'success' || needs.attest-prerelease.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's signed inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: praxi-linux-signed-inputs
          path: dist
          digest-mismatch: error
      - name: Verify real signatures and reject altered provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # Obtain trust independently of the signed inputs. The snapshot is
          # carried into a new network namespace with no network or gh cache.
          gh --version
          gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
          test -s "$RUNNER_TEMP/trusted_root.jsonl"
          # Same policy flags as the positive checks; a negative case changes
          # exactly one property (artifact, repo or ref) and must fail with the
          # error that property produces, not for an unrelated reason.
          verify_with() {
            gh attestation verify "$1" --bundle dist/praxi-linux.sigstore.json \
              --repo "$2" --hostname github.com \
              --signer-workflow github.com/emreocell/Praxi-Bot/.github/workflows/linux-release.yml \
              --source-ref "$3" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --predicate-type https://slsa.dev/provenance/v1 --digest-alg sha256
          }
          verify() { verify_with "$1" emreocell/Praxi-Bot "$GITHUB_REF"; }
          expect_verify_failure() {
            local name="$1" message="$2" output; shift 2
            if output="$(verify_with "$@" 2>&1)"; then
              echo "accepted $name" >&2; exit 1
            fi
            printf '%s\n' "$output"
            grep -Fq -- "$message" <<<"$output" || { echo "$name failed for an unexpected reason" >&2; exit 1; }
            echo "PASS: $name rejected for the expected reason"
          }
          for asset in dist/*.tar.gz dist/install-linux.sh; do verify "$asset"; done
          bash scripts/install-linux.sh --verify-only --version "$TAG" \
            --file dist/praxi-linux-x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/offline-gh" "$RUNNER_TEMP/offline-cache"
          sudo unshare --net -- env PATH="$PATH" \
            GH_CONFIG_DIR="$RUNNER_TEMP/offline-gh" XDG_CACHE_HOME="$RUNNER_TEMP/offline-cache" \
            bash scripts/install-linux.sh --verify-only --offline --version "$TAG" \
              --file dist/praxi-linux-x86_64.tar.gz --custom-trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
          cp dist/praxi-linux-x86_64.tar.gz "$RUNNER_TEMP/tampered.tar.gz"
          printf 'tampered' >> "$RUNNER_TEMP/tampered.tar.gz"
          # gh >= 2.80.0 error texts: cli/cli pkg/cmd/attestation/verification/sigstore.go
          # and extensions.go. When stdout is not a TTY (e.g. captured in $()),
          # io.Handler.Println suppresses the "✗ Sigstore/Policy verification failed"
          # banner, so gh prints only the returned Cobra error. The digest is checked
          # in the Sigstore stage; ref and repository are checked in the later policy stage.
          expect_verify_failure 'tampered artifact' 'Error: verifying with issuer "sigstore.dev"' \
            "$RUNNER_TEMP/tampered.tar.gz" emreocell/Praxi-Bot "$GITHUB_REF"
          expect_verify_failure 'wrong ref' 'expected SourceRepositoryRef to be refs/tags/v0.0.0-wrong-ref' \
            dist/install-linux.sh emreocell/Praxi-Bot refs/tags/v0.0.0-wrong-ref
          expect_verify_failure 'wrong repository' 'expected SourceRepositoryOwnerURI to be https://github.com/attacker' \
            dist/install-linux.sh attacker/Praxi-Bot "$GITHUB_REF"

  publish-prerelease:
    name: Publish pre-release assets
    needs: [plan, check-version, verify-tagged-release]
    # !cancelled() + an explicit result check: the implicit success() would also fail when the sibling
    # attest job (final-only or pre-only) was skipped. Verification must still have succeeded.
    if: ${{ !cancelled() && needs.verify-tagged-release.result == 'success' && needs.plan.outputs.kind == 'pre' && needs.plan.outputs.publish == 'true' && github.repository == 'emreocell/Praxi-Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's verified signed inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: praxi-linux-signed-inputs
          path: dist
          digest-mismatch: error
      - name: Attach the assets to the tag's pre-release (never overwriting)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.check-version.outputs.previous_tag }}
        run: bash scripts/release/publish-linux-assets.sh "$TAG" "$PREVIOUS_TAG"

  release:
    name: Publish verified immutable release
    needs: [plan, check-version, verify-tagged-release]
    # See publish-prerelease: explicit verification result instead of the implicit success().
    if: ${{ !cancelled() && needs.verify-tagged-release.result == 'success' && needs.plan.outputs.kind == 'final' && needs.plan.outputs.publish == 'true' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's verified signed inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: praxi-linux-signed-inputs
          path: dist
          digest-mismatch: error
      - name: Publish verified assets and bootstrap instructions (never overwriting)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.check-version.outputs.previous_tag }}
        run: bash scripts/release/publish-linux-assets.sh "$TAG" "$PREVIOUS_TAG"
