name: Landing page

# Static landing page in site/. Tests and builds on every change; publishes to
# GitHub Pages only from main. If the docs site (VitePress) is later published
# from the same Pages deployment, merge the two build steps into one artifact.
on:
  push:
    branches: [main]
    paths: ["site/**", "packages/ui/tokens.css", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "packages/ui/tokens.css", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-landing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test
        run: node --test site/test/site.test.mjs
      - name: Build
        run: node site/scripts/build.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
