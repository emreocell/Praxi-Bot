name: Dependency hygiene

# Weekly dependency security, ban, and licence check (plus manual dispatch).
# Never runs on pull requests or on forks, never uses secrets, and uses least-privilege
# permissions split across jobs (`contents: read` to audit, `issues: write` to report).
on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Mondays 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-hygiene
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  audit:
    name: Audit Cargo and npm dependencies
    # A scheduled run on a fork must never open issues or burn fork minutes.
    if: github.repository == 'emreocell/Praxi-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: dependency-hygiene

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-audit

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Run cargo-deny, cargo-audit, pnpm audit, and licence report checks
        id: checks
        run: |
          set -uo pipefail
          mkdir -p out

          deny_status=0
          cargo deny --all-features check advisories licenses bans sources > out/cargo-deny.log 2>&1 || deny_status=$?

          audit_status=0
          cargo audit > out/cargo-audit.log 2>&1 || audit_status=$?

          pnpm_status=0
          pnpm audit --prod > out/pnpm-audit.log 2>&1 || pnpm_status=$?

          license_status=0
          python3 scripts/license_report.py --check --check-advisory-expiry > out/license-report.log 2>&1 || license_status=$?

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/dependency_hygiene_report.py \
            --check "cargo-deny::cargo deny --all-features check advisories licenses bans sources::${deny_status}::out/cargo-deny.log" \
            --check "cargo-audit::cargo audit::${audit_status}::out/cargo-audit.log" \
            --check "pnpm-audit::pnpm audit --prod::${pnpm_status}::out/pnpm-audit.log" \
            --check "license-and-expiry::python3 scripts/license_report.py --check --check-advisory-expiry::${license_status}::out/license-report.log" \
            --run-url "$run_url" \
            --timestamp "$ts" \
            --out-markdown out/hygiene-report.md \
            --out-status out/status.json

          cat out/hygiene-report.md >> "$GITHUB_STEP_SUMMARY"

          overall=0
          if [ "$deny_status" -ne 0 ] || [ "$audit_status" -ne 0 ] || [ "$pnpm_status" -ne 0 ] || [ "$license_status" -ne 0 ]; then
            overall=1
          fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-hygiene-report
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Fail job when findings were reported
        env:
          OVERALL: ${{ steps.checks.outputs.overall }}
        run: |
          if [ "${OVERALL:-1}" != "0" ]; then
            echo "Dependency hygiene checks reported findings (see job summary and tracking issue)."
            exit 1
          fi

  report-issue:
    name: Open or update tracking issue
    needs: audit
    if: always() && github.repository == 'emreocell/Praxi-Bot' && (needs.audit.result == 'success' || needs.audit.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Download hygiene report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-hygiene-report
          path: out

      - name: Create, update, or close the single tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          status = json.loads(Path("out/status.json").read_text(encoding="utf-8"))
          report_path = Path("out/hygiene-report.md")
          marker = status["marker"]
          title = status["title"]
          has_findings = bool(status["has_findings"])

          raw = subprocess.check_output(
              [
                  "gh",
                  "issue",
                  "list",
                  "--repo",
                  repo,
                  "--state",
                  "open",
                  "--search",
                  f'"{title}" in:title',
                  "--limit",
                  "50",
                  "--json",
                  "number,title,body",
              ],
              text=True,
          )
          issues = json.loads(raw)
          if not issues:
              raw_recent = subprocess.check_output(
                  ["gh", "issue", "list", "--repo", repo, "--state", "open", "--limit", "100", "--json", "number,title,body"],
                  text=True,
              )
              issues = json.loads(raw_recent)
          matches = [i for i in issues if marker in (i.get("body") or "") or i.get("title") == title]
          existing = min(matches, key=lambda i: int(i["number"])) if matches else None

          if has_findings:
              if existing:
                  subprocess.run(
                      ["gh", "issue", "edit", str(existing["number"]), "--repo", repo, "--body-file", str(report_path)],
                      check=True,
                  )
                  print(f"Updated existing tracking issue #{existing['number']}")
              else:
                  subprocess.run(
                      ["gh", "issue", "create", "--repo", repo, "--title", title, "--body-file", str(report_path)],
                      check=True,
                  )
                  print("Created new tracking issue")
          elif existing:
              subprocess.run(
                  ["gh", "issue", "edit", str(existing["number"]), "--repo", repo, "--body-file", str(report_path)],
                  check=True,
              )
              subprocess.run(
                  [
                      "gh",
                      "issue",
                      "close",
                      str(existing["number"]),
                      "--repo",
                      repo,
                      "--comment",
                      f"All weekly dependency hygiene checks passed ({status.get('run_url', '')}); closing this tracking issue.",
                  ],
                  check=True,
              )
              print(f"Closed resolved tracking issue #{existing['number']}")
          else:
              print("All checks passed and no open tracking issue exists.")
          PY
