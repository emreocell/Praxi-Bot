name: Windows Installer

# Deliberately NOT triggered on every push/PR: a release build + NSIS bundle is slow. A pull
# request that touches the installer itself does run it, because that build is the only thing
# that compiles the NSIS script and starts the result (silent install and uninstall below).
on:
  pull_request:
    paths:
      - "apps/desktop/nsis/**"
      - "apps/desktop/tauri.conf.json"
      - "scripts/installer/**"
      - "scripts/release/collect_sbom.py"
      - "scripts/release/verify-windows.ps1"
      - "scripts/release/update_manifest.py"
      - "scripts/tests/test_windows_release.py"
      - "scripts/tests/test_update_manifest.py"
      - ".github/workflows/installer.yml"
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1" # weekly, Mondays 04:00 UTC

# Nothing is granted by default. Each job asks for exactly what it needs:
#   windows-installer  contents: read                                   (builds; holds the signing secrets)
#   attest             contents: read, id-token: write, attestations: write   (no secrets, no build)
#   attach-to-release  contents: write                                  (no checkout, no build, no secrets)
permissions: {}

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Build NSIS installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release supply-chain policy (pinned actions, job permissions, SBOM, verifier)
        shell: pwsh
        run: python -B -m unittest discover -s scripts/tests -p test_windows_release.py -v

      - name: Check the branded installer assets are current
        shell: pwsh
        run: python scripts/installer/generate_installer_assets.py --check

      - name: Forbid killing processes by image name in the installer
        shell: pwsh
        run: python -B scripts/installer/check_no_taskkill_by_name.py

      - name: Check tagged release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: python -B scripts/release/check_version.py "$env:GITHUB_REF_NAME"

      # In-app updates (docs/updates.md). Three cases on a tag build, decided here before the long build:
      #   key secret + public key in tauri.conf.json  -> release: signed installer and latest.json
      #   neither                                     -> off: the release is built and published as
      #                                                  before (no signature, no latest.json) and the
      #                                                  app says "updates not set up"; a warning in the
      #                                                  job summary says what to run
      #   only one of the two                         -> fail: the update could not be verified
      # Other runs (pull requests, the weekly build, manual runs) rehearse the whole path with a
      # throwaway key instead and never touch the real secret.
      - name: Check the updater configuration and signing key
        shell: pwsh
        env:
          HAVE_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $checkArgs = @('check-config', '--config', 'apps/desktop/tauri.conf.json')
          $mode = 'rehearsal'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $conf = Get-Content -Raw -LiteralPath apps/desktop/tauri.conf.json | ConvertFrom-Json
            $havePub = -not [string]::IsNullOrWhiteSpace([string]$conf.plugins.updater.pubkey)
            $haveKey = $env:HAVE_UPDATER_KEY -eq 'true'
            if ($haveKey -and $havePub) {
              $mode = 'release'
              $checkArgs += '--require-pubkey'
            } elseif ($haveKey) {
              throw "The repository secret TAURI_SIGNING_PRIVATE_KEY is set but tauri.conf.json has no updater public key, so the app could not verify this update. Run scripts/release/setup-updater-key.ps1 and commit the change it makes (docs/updates.md), or remove the secret to release without in-app updates."
            } elseif ($havePub) {
              throw "tauri.conf.json has an updater public key but the repository secret TAURI_SIGNING_PRIVATE_KEY is not set, so this release could not sign its update. Set the secret (docs/updates.md), or the installed apps would be told about an update they cannot trust."
            } else {
              $mode = 'off'
              $warning = 'in-app updates not enabled: run scripts/release/setup-updater-key.ps1 (docs/updates.md). This release is built and published without a signed update and without latest.json; the app shows "updates not set up".'
              Write-Host "::warning title=In-app updates not enabled::$warning"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "### In-app updates not enabled`n$warning`n"
            }
          }
          python -B scripts/release/update_manifest.py @checkArgs
          if ($LASTEXITCODE -ne 0) { throw "tauri.conf.json is not ready for a signed release (see the message above)" }
          "PRAXI_UPDATER_MODE=$mode" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # rust-toolchain.toml pins channel = "stable" (+ rustfmt, clippy); rustup
      # honours it automatically once this installs stable.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create a throwaway updater key (rehearsal, not a release)
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'rehearsal-updater.key'
          pnpm exec tauri signer generate --ci -w $key
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$key.pub")) { throw "could not create the throwaway key" }
          "PRAXI_REHEARSAL_UPDATER_KEY=$key" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Software bills of materials (CycloneDX 1.5) for what the installer ships: the `bot` daemon
      # sidecar and the desktop shell (Rust, from Cargo.lock + cargo metadata) and the UI bundle
      # (npm packages the UI needs at runtime, from pnpm-lock.yaml). Generated before the long
      # build so a broken SBOM fails fast. Published with the release; see docs/guide/verify-download.md.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx@0.5.10

      - name: Generate SBOMs (CycloneDX)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sbom | Out-Null
          cargo cyclonedx --format json --spec-version 1.5 --quiet
          if ($LASTEXITCODE -ne 0) { throw "cargo cyclonedx failed with exit code $LASTEXITCODE" }
          pnpm --filter desktop-ui sbom --sbom-format cyclonedx --sbom-spec-version 1.5 `
            --sbom-type application --prod --lockfile-only --out (Join-Path $PWD "sbom/sbom-ui.cdx.json")
          if ($LASTEXITCODE -ne 0) { throw "pnpm sbom failed with exit code $LASTEXITCODE" }
          python -B scripts/release/collect_sbom.py --root . --out sbom
          if ($LASTEXITCODE -ne 0) { throw "collect_sbom.py failed with exit code $LASTEXITCODE" }

      # tauri.conf.json bundles the `bot` CLI/daemon via
      # externalBin "binaries/bot", expected as bot-<target-triple>.exe.
      - name: Build and stage bot sidecar
        shell: pwsh
        run: |
          $triple = (rustc -Vv | Select-String "host:").ToString().Split(":")[1].Trim()
          Write-Host "Target triple: $triple"
          # The release tag this build belongs to (v0.1.0-alpha.1): `bot host add` tells the server
          # which GitHub release to install; the Cargo version alone (0.1.0) is not that tag.
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:PRAXI_RELEASE_TAG = $env:GITHUB_REF_NAME }
          cargo build --release --locked -p cli
          New-Item -ItemType Directory -Force -Path apps/desktop/binaries | Out-Null
          Copy-Item "target/release/bot.exe" "apps/desktop/binaries/bot-$triple.exe" -Force
          if ((Get-Item "apps/desktop/binaries/bot-$triple.exe").Length -le 0) { throw "sidecar is empty" }

      # DISABLED until a code-signing certificate exists. To enable: add the
      # secrets below, set `if: true`, and make sure the thumbprint is applied
      # (e.g. via bundle.windows.certificateThumbprint or a signCommand).
      - name: Import signing certificate (disabled, no certificate yet)
        # Turns on when the owner sets the repo variable WINDOWS_CODE_SIGNING to 'true'.
        if: ${{ vars.WINDOWS_CODE_SIGNING == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The installer is built WITHOUT the signing key: the private key is only given to the signing
      # step below, never to the build scripts of the dependencies. The app trusts the public key in
      # tauri.conf.json; a rehearsal build trusts its throwaway key instead.
      - name: Build installer
        shell: pwsh
        run: |
          # Keep the prerelease suffix in the app version and signed update metadata.
          # Checked-in manifests intentionally keep only the numeric version.
          $desktopConfig = @{}
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $desktopConfig.version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $pub = (Get-Content -Raw -LiteralPath "$($env:PRAXI_REHEARSAL_UPDATER_KEY).pub").Trim()
            $desktopConfig.plugins = @{ updater = @{ pubkey = $pub } }
          }
          $desktopConfigPath = Join-Path $env:RUNNER_TEMP 'praxi-desktop-build.json'
          $desktopConfig | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $desktopConfigPath -Encoding utf8
          pnpm build:desktop --config $desktopConfigPath

      - name: Smoke test installer
        shell: pwsh
        run: |
          $dir = "target/release/bundle/nsis"
          $installer = Get-ChildItem $dir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in $dir" }
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.Name) ($mb MB)"
          if ($installer.Length -lt 5MB -or $installer.Length -gt 500MB) {
            throw "Installer size $mb MB is outside the sane range (5-500 MB)"
          }

          # Silent per-user install into a temp dir, then check the bundled sidecar runs.
          $dest = Join-Path $env:RUNNER_TEMP "praxibot-install"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed with exit code $($p.ExitCode)" }
          Get-ChildItem $dest -Recurse | Select-Object -ExpandProperty FullName
          if (-not (Test-Path (Join-Path $dest "bot-desktop.exe"))) { throw "bot-desktop.exe missing from install dir" }
          $sidecar = Get-ChildItem $dest -Recurse -Include "bot.exe", "bot-*.exe" |
            Where-Object { $_.Name -ne "bot-desktop.exe" -and $_.Length -gt 0 } | Select-Object -First 1
          if (-not $sidecar) { throw "bot sidecar missing from install dir" }
          $out = & $sidecar.FullName --version
          Write-Host "sidecar --version: $out"
          if ($LASTEXITCODE -ne 0) { throw "sidecar --version exited with $LASTEXITCODE" }

          # The installed daemon must be byte-for-byte the sidecar that gets attested below, so a user
          # can compare the installed bot.exe with the attested file (docs/guide/verify-download.md).
          $built = Get-ChildItem apps/desktop/binaries -Filter "bot-*.exe" | Select-Object -First 1
          $builtHash = (Get-FileHash $built.FullName -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash $sidecar.FullName -Algorithm SHA256).Hash
          Write-Host "sidecar sha256: built=$builtHash installed=$installedHash"
          if ($builtHash -ne $installedHash) { throw "the installed sidecar differs from the built sidecar" }

          $un = Get-ChildItem $dest -Filter "uninstall*.exe" | Select-Object -First 1
          if ($un) { Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait }

      # The "for everyone" install (the Advanced options choice) uses /ALLUSERS when run silently. The
      # runner is an administrator, so this checks the machine-wide registration and its removal.
      - name: Smoke test installer, for everyone (silent)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP "praxibot-all-users"
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Praxi-Bot"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/ALLUSERS", "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent all-users install failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dest "bot-desktop.exe"))) { throw "bot-desktop.exe missing from the all-users install dir" }
          if (-not (Test-Path $key)) { throw "No machine-wide uninstall entry was written" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Praxi-Bot") { throw "A per-user entry was written for an all-users install" }
          # An uninstaller started without _?= copies itself to %TEMP% and returns at once, so run it
          # in place (_?= must be the last argument) to be able to check the result right away.
          $u = Start-Process -FilePath (Join-Path $dest "uninstall.exe") -ArgumentList "/S", "_?=$dest" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Silent all-users uninstall failed with exit code $($u.ExitCode)" }
          if (Test-Path $key) { throw "The machine-wide uninstall entry is still there after uninstalling" }

      # Signs the installer (minisign, bound to this exact version, which the app requires) and writes
      # the update feed `latest.json` that the app reads. Skipped when in-app updates are not enabled. The feed is checked here, offline, against
      # the app's public key: a release whose update the app would refuse fails the build instead.
      # The app still verifies the signature itself before installing anything.
      - name: Sign the installer and write the update feed (latest.json)
        if: env.PRAXI_UPDATER_MODE != 'off'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $conf = Get-Content -Raw -LiteralPath apps/desktop/tauri.conf.json | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $keyArgs = @('--config', 'apps/desktop/tauri.conf.json')
          } else {
            $tag = "v$($conf.version)"
            $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -Raw -LiteralPath $env:PRAXI_REHEARSAL_UPDATER_KEY
            $keyArgs = @('--pubkey-file', "$($env:PRAXI_REHEARSAL_UPDATER_KEY).pub")
          }
          $version = $tag.Substring(1)
          # A trailing newline (pasted secret) would make the key unreadable.
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $installer = Get-ChildItem "target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found" }
          pnpm exec tauri signer sign --app-version $version $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signing the installer failed" }
          $sig = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $sig)) { throw "no signature file was written" }
          New-Item -ItemType Directory -Force -Path update-assets | Out-Null
          Copy-Item -LiteralPath $sig update-assets
          $makeArgs = @('make', '--tag', $tag, '--version', $version, '--installer', $installer.FullName,
            '--signature', $sig, '--pub-date', (git show -s --format=%cI $env:GITHUB_SHA), '--out', 'update-assets/latest.json') + $keyArgs
          # Hand-written notes for a release (plain text, optional <!-- lang: xx --> blocks) are used when present.
          $notes = "docs/release-notes/$tag.md"
          if (Test-Path -LiteralPath $notes) { $makeArgs += @('--notes-file', $notes) }
          python -B scripts/release/update_manifest.py @makeArgs
          if ($LASTEXITCODE -ne 0) { throw "could not write the update feed" }
          python -B scripts/release/update_manifest.py check --manifest update-assets/latest.json --tag $tag @keyArgs
          if ($LASTEXITCODE -ne 0) { throw "the update feed does not pass its own check" }
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            Write-Host "::notice::Rehearsal: the feed was signed with a throwaway key. It is not a release feed."
          }

      # Everything that is published for this build, in one folder: the installer, the daemon sidecar
      # it contains, the SBOMs, a note of the build environment, the verifier script and the
      # SHA-256 list. The next job attests every file in this folder.
      - name: Assemble the release files
        shell: pwsh
        run: |
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installer = Get-ChildItem "target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found" }
          Copy-Item $installer.FullName $out
          $sidecar = Get-ChildItem apps/desktop/binaries -Filter "bot-*.exe" | Select-Object -First 1
          Copy-Item $sidecar.FullName $out
          Copy-Item sbom/*.cdx.json $out
          Copy-Item scripts/release/verify-windows.ps1 $out
          # Absent when in-app updates are not enabled for this release (PRAXI_UPDATER_MODE=off).
          if (Test-Path update-assets) { Copy-Item update-assets/* $out }

          # What this build ran on, so that someone who wants to rebuild knows the inputs.
          # (Tool versions are not pinned: see "Can I rebuild it myself?" in docs/guide/verify-download.md.)
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '(not a tag build)' }
          $info = @(
            "Praxi-Bot Windows build",
            "release tag : $tag",
            "source ref  : $env:GITHUB_REF",
            "commit      : $env:GITHUB_SHA",
            "workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "runner image: $env:ImageOS $env:ImageVersion",
            "rustc       : $(rustc -V)",
            "cargo       : $(cargo -V)",
            "node        : $(node -v)",
            "pnpm        : $(pnpm -v)",
            "Cargo.lock sha256     : $((Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLower())",
            "pnpm-lock.yaml sha256 : $((Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash.ToLower())"
          )
          $utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::WriteAllText((Join-Path $PWD "$out/build-info.txt"), (($info -join "`n") + "`n"), $utf8)

          # SHA256SUMS.txt: "<hash>  <name>" for every other file (the format `sha256sum -c` reads).
          $lines = Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path $PWD "$out/SHA256SUMS.txt"), (($lines -join "`n") + "`n"), $utf8)
          Get-Content "$out/SHA256SUMS.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praxi-bot-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praxi-bot-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  # Build provenance (SLSA, through GitHub's attestation service) for every release file. Only this
  # job may request the OIDC token; it runs no project code and sees no secrets. Never for pull
  # requests or the weekly build, and only for this repository's own tag or main.
  attest:
    name: Attest build provenance
    needs: windows-installer
    if: >-
      github.repository == 'emreocell/Praxi-Bot' &&
      github.event.repository.fork != true &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download the release files of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: praxi-bot-windows-release
          path: release
          digest-mismatch: error

      - name: Check the files against their SHA-256 list
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          ls -l

      - name: Attest the installer, the sidecar, the SBOMs and the checksum list
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Verify the attestations and keep the bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          cp -- "$BUNDLE_PATH" provenance/praxi-bot-windows.sigstore.json
          for asset in release/*; do
            gh attestation verify "$asset" --bundle provenance/praxi-bot-windows.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --hostname github.com \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/installer.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --predicate-type https://slsa.dev/provenance/v1 --digest-alg sha256
          done

      - name: Upload the provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praxi-bot-windows-provenance
          path: provenance/praxi-bot-windows.sigstore.json
          if-no-files-found: error
          retention-days: 30

  # Pre-release tags only (v1.2.3-alpha.1): add the files to that tag's GitHub release if it already
  # exists. Never creates a release, never replaces an asset (a file that is already there must be
  # byte-identical, otherwise the job fails). Final tags (v1.2.3) are attached by hand, after the
  # same review the Linux packages need: docs/contributing/releasing.md.
  attach-to-release:
    name: Attach to the pre-release
    needs: attest
    if: >-
      github.repository == 'emreocell/Praxi-Bot' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: praxi-bot-windows-release
          path: release-files
          digest-mismatch: error

      - name: Download the provenance bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: praxi-bot-windows-provenance
          path: release-files
          digest-mismatch: error

      - name: Upload to the release (never replacing an asset)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            {
              echo "### No release for $TAG yet"
              echo "The files were built and attested but not attached. Create the release with them:"
              echo '```'
              echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name praxi-bot-windows-release --name praxi-bot-windows-provenance --dir release-files"
              echo "gh release create $TAG release-files/* --repo $GITHUB_REPOSITORY --verify-tag --prerelease --generate-notes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No release for $TAG yet: see the job summary for the command that creates it with these files."
            exit 0
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets[] | [.name, (.digest // "")] | @tsv')"
          upload=()
          for file in release-files/*; do
            name="$(basename "$file")"
            sum="$(sha256sum "$file" | cut -d' ' -f1)"
            if ! printf '%s\n' "$assets" | cut -f1 | grep -Fx -- "$name" > /dev/null; then
              upload+=("$file")
            elif printf '%s\n' "$assets" | grep -Fx -- "$(printf '%s\tsha256:%s' "$name" "$sum")" > /dev/null; then
              echo "already attached, identical: $name"
            else
              echo "::error::$name is already on the release $TAG with different content; refusing to overwrite it"
              exit 1
            fi
          done
          if [[ ${#upload[@]} -gt 0 ]]; then
            gh release upload "$TAG" "${upload[@]}"
          fi
