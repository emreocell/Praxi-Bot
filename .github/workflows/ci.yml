name: CI

# Fork pull requests run this workflow with a read-only token and no secrets, and the
# jobs below never use secrets. Keep it that way (see docs/contributing/MAINTAINING.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the long jobs a pull request needs. A change that only touches
  # documentation, repository metadata, the marketing site, packaging manifests or the
  # desktop UI sources (apps/desktop/ui, packages/ui) skips the Rust jobs. A change that only
  # touches UI sources also skips the Windows real-app smoke lane (Linux still runs it).
  # Visual regression runs only when apps/desktop/ui or packages/ change (not site/ or lockfiles).
  # Everything else, and every push to main, runs them all.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      visual: ${{ steps.filter.outputs.visual }}
      smoke: ${{ steps.filter.outputs.smoke }}
      # JSON list of the operating systems the real-app smoke job runs on.
      smoke_os: ${{ steps.filter.outputs.smoke_os }}
    steps:
      - name: Checkout (merge commit and its first parent)
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] || ! git rev-parse --verify -q HEAD^2 >/dev/null; then
            echo "Not a pull request merge commit: run everything."
            python3 scripts/ci_pr_path_classifiers.py --full >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the merge of the PR into main; HEAD^1 is main.
          git diff --name-only HEAD^1 HEAD > changed.txt
          echo "Changed files:"; cat changed.txt
          python3 scripts/ci_pr_path_classifiers.py < changed.txt >> "$GITHUB_OUTPUT"

  # Always runs and is cheap: relative Markdown links must resolve.
  docs-check:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check relative Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Check every guide page is linked from the guide index
        run: python3 scripts/check_guide_index.py

      - name: Test CI report parser
        run: |
          python3 -m unittest discover -s scripts/tests -p test_ci_report.py -v
          python3 scripts/test_report.py --self-test
          python3 -m unittest discover -s scripts/tests -p test_test_report_weekly.py -v
          python3 -m unittest discover -s scripts/tests -p test_ci_pr_path_classifiers.py -v

      - name: Test the MCP catalog checker (offline, loopback only)
        run: python3 -B -m unittest discover -s scripts/tests -p test_check_mcp_catalog.py -v

      - name: Verify the MCP catalog offline (schema, pins, licences, auth, logos, guide table)
        run: |
          python3 scripts/verify_mcp_catalog.py
          python3 -B -m unittest discover -s scripts/tests -p test_verify_mcp_catalog.py -v

      - name: Check the branded installer texts, colours and template
        run: |
          python3 scripts/installer/generate_installer_assets.py --check
          python3 -B -m unittest discover -s scripts/tests -p test_installer_assets.py -v

      - name: Test the in-app update feed generator and its checks
        run: python3 -B -m unittest discover -s scripts/tests -p test_update_manifest.py -v

      - name: Check third-party notices consistency and dependency hygiene tests
        run: |
          python3 scripts/license_report.py --check-notices
          python3 -B -m unittest discover -s scripts/tests -p "test_license_report.py" -v
          python3 -B -m unittest discover -s scripts/tests -p "test_dependency_hygiene.py" -v

  build-and-test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # A hung test must not stall the queue for hours.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows test run is the longest job, so its tests are split in two halves by
          # nextest (hash of the test name: stable when tests are added). Both halves build the
          # tests in parallel. The first one keeps the old job name and also runs fmt and Clippy;
          # the second one runs the other half and the doctests, so every test still runs once.
          - os: windows-latest
            suite: workspace
            partition: hash:1/2
            no-doctests: true
            name: Build & Test (windows-latest)
          - os: windows-latest
            suite: workspace
            partition: hash:2/2
            tests-only: true
            name: Build & Test (windows-latest, tests 2/2)
          - os: windows-latest
            suite: embeddings
            name: Local Embeddings (windows-latest)
          - os: ubuntu-latest
            suite: workspace
            name: Build & Test (ubuntu-latest)
          # Keep the same feature checks on Linux, parallel with the workspace suite.
          - os: ubuntu-latest
            suite: embeddings
            name: Local Embeddings (ubuntu-latest)
    env:
      # Keep file and line information in backtraces while reducing the debug
      # data Cargo writes, links, and restores from the dependency cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up sccache (Windows)
        if: matrix.os == 'windows-latest' && matrix.suite == 'workspace'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-nextest
        if: matrix.suite != 'embeddings'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libxcb1-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # The feature-enabled lane saves a different set of compiled dependencies.
          key: ${{ matrix.suite == 'embeddings' && 'local-embeddings' || '' }}
          # Workspace lanes on the same OS share one dependency cache (both Windows test halves).
          shared-key: ${{ matrix.suite == 'workspace' && matrix.os || '' }}
          # PRs restore main's cache; avoid costly PR-only uploads and cache eviction. The second
          # Windows half uses the first one's cache key, so only the first one saves it.
          save-if: ${{ github.ref == 'refs/heads/main' && !matrix.tests-only }}

      - name: Check formatting
        if: matrix.suite != 'embeddings' && !matrix.tests-only
        run: cargo fmt --all --check

      - name: Run Clippy
        if: matrix.suite != 'embeddings' && !matrix.tests-only
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Workspace feature unification enables the server and masks proxy-only lint failures.
      - name: Run Clippy for the remote API without the server feature
        if: (success() || failure()) && runner.os == 'Linux' && matrix.suite == 'workspace'
        run: cargo clippy -p remote-api --all-targets -- -D warnings

      # Run even when clippy failed so one gate cannot hide another's evidence.
      # nextest runs every test in its own process and schedules them across all
      # binaries at once (no retries: see the `ci` profile in .config/nextest.toml).
      # It does not run doctests, so `cargo test --doc` follows; both always run. The first
      # Windows half skips the doctests, the second one runs them (see the matrix).
      - name: Run tests
        if: (success() || failure()) && matrix.suite != 'embeddings'
        timeout-minutes: ${{ matrix.os == 'windows-latest' && 65 || 35 }}
        shell: bash
        env:
          # `count:1/1` is every test; Windows runs two halves (see the matrix).
          PARTITION: ${{ matrix.partition || 'count:1/1' }}
          NO_DOCTESTS: ${{ matrix.no-doctests }}
        run: |
          status=0
          cargo nextest run --workspace --no-fail-fast --profile ci --partition "$PARTITION" || status=$?
          if [ "$NO_DOCTESTS" != true ]; then
            cargo test --workspace --doc --no-fail-fast || status=$?
          fi
          exit "$status"

      - name: Verify explicit-artifact dependency features
        if: (success() || failure()) && matrix.suite != 'workspace'
        run: |
          python scripts/check_local_embedding_features.py --self-test
          python scripts/check_local_embedding_features.py

      - name: Check explicit-artifact local embeddings
        if: (success() || failure()) && matrix.suite != 'workspace'
        env:
          ORT_SKIP_DOWNLOAD: "1"
          ORT_OFFLINE: "1"
        run: cargo clippy -p memory-store -p provider-catalog -p daemon-api -p cli --all-targets --features local-embeddings -- -D warnings

      - name: Prefetch dependencies for offline local embedding tests
        if: (success() || failure()) && matrix.suite != 'workspace'
        run: cargo fetch --locked

      - name: Test local embeddings with Cargo offline and native downloads disabled
        if: (success() || failure()) && matrix.suite != 'workspace'
        env:
          CARGO_NET_OFFLINE: "true"
          ORT_SKIP_DOWNLOAD: "1"
          ORT_OFFLINE: "1"
        run: cargo test --offline -p memory-store -p daemon-api --features local-embeddings --no-fail-fast

  browser-integration:
    name: Browser integration (Chrome for Testing)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libxcb1-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-rust
          # PRs restore main's cache and never save their own: every PR-only copy (hundreds of MB
          # each, for the smoke and browser lanes) pushes the repository over GitHub's 10 GB cache
          # limit, and the eviction then removes main's cache and makes later runs start cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same pin and checksums as scripts/install-linux.sh (install_cft).
      - name: Install pinned Chrome for Testing
        run: |
          set -euo pipefail
          version="157.0.8103.38"
          expected="8cdeb344e9b2cefe59f4aea8d1d93d5d93054c03cde217665c16fc1f62e72a66"
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/chrome.zip"
          echo "${expected}  $RUNNER_TEMP/chrome.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/cft"
          echo "PRAXI_BROWSER_PATH=$RUNNER_TEMP/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"
          # ubuntu-24.04 restricts unprivileged user namespaces (Chrome sandbox).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run browser-cdp integration tests
        run: cargo test -p browser-cdp --test browser --test dialogs -- --ignored --test-threads=1

      - name: Run browser tool integration tests (pointer mode, recovery, attach)
        run: cargo test -p builtin-tools --test browser_pointer -- --ignored --test-threads=1

  license-check:
    name: License Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-rust
          # PRs restore main's cache and never save their own: every PR-only copy (hundreds of MB
          # each, for the smoke and browser lanes) pushes the repository over GitHub's 10 GB cache
          # limit, and the eviction then removes main's cache and makes later runs start cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check licenses bans advisories sources

      - name: Check generated licence report, notices, and advisory expiry dates
        run: python3 scripts/license_report.py --check --check-advisory-expiry

  ui-lint-and-typecheck:
    name: UI Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: UI tests
        run: pnpm --filter ./apps/desktop/ui test

      - name: UI i18n keys
        run: pnpm --dir apps/desktop/ui check:i18n

      - name: UI theme contrast
        run: pnpm --dir apps/desktop/ui check:themes

      - name: UI shell layout
        run: pnpm --dir apps/desktop/ui check:layout

      - name: Check UI production licences against report and notices
        run: python3 scripts/license_report.py --check-ui

      # axe-core over the mock-mode screens in headless Chrome (preinstalled on ubuntu-latest).
      - name: UI accessibility (axe-core)
        run: CHROME_BIN="$(command -v google-chrome || command -v chromium)" pnpm --dir apps/desktop/ui check:a11y

      # docs/api/openapi.json is checked by the `openapi_snapshot` test inside
      # `cargo test --workspace` (Build & Test). This checks the file generated from it.
      - name: Generated API types are up to date
        run: |
          pnpm --dir apps/desktop/ui gen:api
          if ! git diff --exit-code -- apps/desktop/ui/src/api/schema.d.ts; then
            echo "::error file=apps/desktop/ui/src/api/schema.d.ts::schema.d.ts is out of date with docs/api/openapi.json. Run 'pnpm --dir apps/desktop/ui gen:api' and commit the result."
            exit 1
          fi

  # Screenshot comparison and wallpaper text contrast over the mock screens. Non-blocking on purpose
  # (continue-on-error, not listed in ci-result) until the baselines have proven stable on Linux.
  visual-regression:
    name: Visual regression (non-blocking)
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Screenshots and contrast
        env:
          VISUAL_OUT: ${{ runner.temp }}/visual
        run: CHROME_BIN="$(command -v google-chrome || command -v chromium)" pnpm --dir apps/desktop/ui check:visual

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: ${{ runner.temp }}/visual/
          retention-days: 7

  desktop-smoke:
    name: Real-app smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Linux always; Windows too unless only UI sources changed (see "Detect changed areas").
        os: ${{ fromJSON(needs.changes.outputs.smoke_os) }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libxcb1-dev xvfb xauth dbus-x11 at-spi2-core

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-smoke
          # PRs restore main's cache and never save their own: every PR-only copy (hundreds of MB
          # each, for the smoke and browser lanes) pushes the repository over GitHub's 10 GB cache
          # limit, and the eviction then removes main's cache and makes later runs start cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chrome for Testing
        shell: pwsh
        env:
          CHROME_VERSION: "157.0.8103.38" # Match the browser integration lane.
          CHROME_PLATFORM: ${{ matrix.os == 'windows-latest' && 'win64' || 'linux64' }}
          CHROME_SHA256: ${{ matrix.os == 'windows-latest' && 'ae0deef27d449e1d7529df7705d609bab102de48464da13567ed3dd2ee1a0586' || '8cdeb344e9b2cefe59f4aea8d1d93d5d93054c03cde217665c16fc1f62e72a66' }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'smoke-chrome.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'smoke-chrome'
          $platform = $env:CHROME_PLATFORM
          curl -fsSL --retry 2 --max-time 180 "https://storage.googleapis.com/chrome-for-testing-public/$env:CHROME_VERSION/$platform/chrome-$platform.zip" -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing download failed' }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $env:CHROME_SHA256) { throw 'Chrome for Testing checksum mismatch' }
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
            $chrome = Join-Path $unpacked "chrome-$platform/chrome.exe"
          } else {
            unzip -q $archive -d $unpacked
            if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing extraction failed' }
            $chrome = Join-Path $unpacked "chrome-$platform/chrome"
          }
          "CHROME_BIN=$chrome" >> $env:GITHUB_ENV

      - name: Build debug daemon and CLI fixture
        shell: pwsh
        run: |
          $shots = Join-Path $env:RUNNER_TEMP 'desktop-smoke'
          New-Item -ItemType Directory -Force $shots | Out-Null
          cargo build --locked -p cli -p cli-provider --bin bot --bin native-cli-fixture 2>&1 |
            Tee-Object -FilePath (Join-Path $shots 'build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SMOKE_SHOTS=$shots" >> $env:GITHUB_ENV

      # Bots created by the UI target this PC. Without a local desktop backend,
      # Linux refuses the run before contacting the loopback model. Xvfb supplies
      # that desktop; a private bus keeps accessibility services off the host bus.
      - name: Run real-app smoke (Linux virtual desktop)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp" dbus-run-session -- pnpm --dir apps/desktop/ui smoke --no-build

      # Evidence for the timing budgets of the powershell-based tests (pty-session, the smoke shell
      # step): how long a start of powershell.exe takes on this runner right now. Cold = first start,
      # warm = the following ones. Never fails the job; the numbers go to the log and the summary.
      - name: Measure powershell start time (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $rows = foreach ($i in 1..4) {
            $t = Measure-Command { & powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'exit 0' }
            [pscustomobject]@{ start = $i; seconds = [math]::Round($t.TotalSeconds, 2) }
          }
          $rows | Format-Table | Out-String | Write-Host
          $defender = try { (Get-MpComputerStatus).RealTimeProtectionEnabled } catch { 'unknown' }
          "Defender real-time protection: $defender" | Write-Host
          "### powershell.exe start time on $env:RUNNER_NAME`n" >> $env:GITHUB_STEP_SUMMARY
          ($rows | ForEach-Object { "- start $($_.start): $($_.seconds) s" }) >> $env:GITHUB_STEP_SUMMARY

      - name: Run real-app smoke (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: pnpm --dir apps/desktop/ui smoke --no-build

      - name: Upload trigger registry screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trigger-registry-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-smoke/trigger-registry-*.png
          retention-days: 7

      - name: Upload smoke screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-smoke/
          retention-days: 7

  # The one check to require in branch protection. It always runs, and it succeeds only when
  # every job above either succeeded or was skipped on purpose (a docs-only change).
  ci-result:
    name: ci-result
    if: always()
    needs: [changes, docs-check, build-and-test, browser-integration, license-check, ui-lint-and-typecheck, desktop-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::At least one required job did not succeed ($r)."; exit 1 ;;
            esac
          done
