name: Linux Scripts

# Lints every tracked shell script and runs the hermetic Linux packaging tests.
# These tests put fake commands on PATH, so they are run only here (a Linux
# runner), never on a developer's Windows machine.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "**/*.sh"
      - ".github/workflows/linux-scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "**/*.sh"
      - ".github/workflows/linux-scripts.yml"

permissions:
  contents: read

concurrency:
  group: linux-scripts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-lint-and-tests:
    name: Shell lint & tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Limit processes for this job
        run: |
          # A runaway test must hit EAGAIN instead of exhausting the runner.
          # RLIMIT_NPROC counts every process of this user, so allow headroom
          # above the threads running now (ps -L) and apply it with an inline
          # `ulimit -u` in each script step.
          current="$(ps -Lu "$(id -u)" --no-headers | wc -l)"
          echo "PRAXI_NPROC_LIMIT=$((current + 1024))" >> "$GITHUB_ENV"

      - name: shellcheck and bash -n on every tracked script
        run: |
          set -euo pipefail
          ulimit -u "$PRAXI_NPROC_LIMIT"
          mapfile -t scripts < <(git ls-files '*.sh')
          [ "${#scripts[@]}" -gt 0 ] || { echo "no tracked shell scripts"; exit 1; }
          printf 'checking: %s\n' "${scripts[@]}"
          shellcheck --version
          timeout -k 5s 120s shellcheck -x "${scripts[@]}"
          for s in "${scripts[@]}"; do
            timeout -k 5s 30s bash -n "$s"
          done

      # Hermetic: sandboxed rootfs in a temp dir, fake id/systemctl/apt-get/curl/
      # gh shims, no root, no systemd, no network, no built binary.
      - name: scripts/linux/tests/test-packaging.sh
        run: |
          set -euo pipefail
          ulimit -u "$PRAXI_NPROC_LIMIT"
          timeout -k 10s 420s bash scripts/linux/tests/test-packaging.sh

      # Hermetic: fake docker/curl shims; checks which image the SearXNG installer will run.
      - name: scripts/linux/tests/test-install-searxng.sh
        run: |
          set -euo pipefail
          ulimit -u "$PRAXI_NPROC_LIMIT"
          timeout -k 10s 120s bash scripts/linux/tests/test-install-searxng.sh
      # Hermetic: sources bootstrap.sh and exercises its helpers (clean environment, pinned GitHub CLI
      # key with throwaway GPG keys). No root, no network, nothing installed.
      - name: scripts/linux/tests/test-bootstrap.sh
        run: |
          set -euo pipefail
          ulimit -u "$PRAXI_NPROC_LIMIT"
          timeout -k 10s 120s bash scripts/linux/tests/test-bootstrap.sh

      - name: Skipped tests
        if: success() || failure()
        run: |
          echo "No tracked shell test is skipped: scripts/linux/tests/test-packaging.sh, scripts/linux/tests/test-install-searxng.sh and scripts/linux/tests/test-bootstrap.sh need no root, systemd, Docker, network or built binary."
