name: Windows sandbox spike

on:
  pull_request:
    paths:
      - 'crates/windows-sandbox-spike/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-sandbox-spike.yml'

permissions:
  contents: read

jobs:
  confinement:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          components: clippy
      - run: cargo clippy -p windows-sandbox-spike --all-targets --features windows-sandbox -- -D warnings
      # Native tests are explicitly ignored: the hosted runner's desktop/profile
      # failed before command execution (STATUS_DLL_INIT_FAILED). Compile them;
      # local Windows verification uses --include-ignored and is recorded in the PR.
      - run: cargo test -p windows-sandbox-spike --features windows-sandbox
