[graph]
all-features = false

[licenses]
# Confidence threshold for license detection.
confidence-threshold = 0.8

# Anything not in this list is denied (GPL, AGPL, LGPL, SSPL, BUSL, etc.).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    # jpeg-encoder is "(MIT OR Apache-2.0) AND IJG"; IJG is a permissive BSD-style license.
    "IJG",
    # iroh -> async_io_stream / pharos / ws_stream_wasm (wasm-only helpers): public-domain dedication.
    "Unlicense",
    # webpki-roots / webpki-root-certs (Mozilla CA bundle data, via iroh and the optional fastembed feature)
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys (bzip2 0.6, a build dependency of sherpa-onnx-sys behind the optional
    # `local-voice` feature): the BSD-style bzip2/libbzip2 licence.
    "bzip2-1.0.6",
]

[bans]
# Warn on duplicate versions of the same crate.
multiple-versions = "warn"
# Deny wildcard dependencies.
wildcards = "deny"

[advisories]
# Vulnerabilities in any crate fail the check. Unmaintained-crate notices are
# only enforced for our direct dependencies: Tauri's Linux GTK stack pulls in
# several unmaintained-but-stable crates we cannot replace.
unmaintained = "workspace"
# chrono / chrono-tz were flagged unmaintained in 2026. They are used across our crates (schedules,
# timestamps) and by async-imap (email connector); no chrono-free release exists within semver.
# Unmaintained is not a vulnerability. Added 2026-11-17; revisit when migrating to jiff/time or
# when async-imap drops chrono, then delete these two entries.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no vulnerability, see note above" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; no vulnerability, see note above" },
]

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# libbz2-rs-sys (pure-Rust port of libbzip2, pulled in by zip -> bzip2 for the optional local-voice
# model archive extraction): "bzip2-1.0.6" is the permissive BSD-style libbzip2 licence.
# Narrow exception for this crate only.
[[licenses.exceptions]]
allow = ["bzip2-1.0.6"]
crate = "libbz2-rs-sys"
