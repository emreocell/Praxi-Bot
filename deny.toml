[graph]
all-features = false

[licenses]
# Confidence threshold for license detection.
confidence-threshold = 0.8

# Anything not in this list is denied (GPL, AGPL, LGPL, SSPL, BUSL, etc.).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
# Warn on duplicate versions of the same crate.
multiple-versions = "warn"
# Deny wildcard dependencies.
wildcards = "deny"

[advisories]
# Vulnerabilities in any crate fail the check. Unmaintained-crate notices are
# only enforced for our direct dependencies: Tauri's Linux GTK stack pulls in
# several unmaintained-but-stable crates we cannot replace.
unmaintained = "workspace"
ignore = [
    # quick-xml < 0.41 (DoS on malicious XML). Only reached via plist ->
    # tauri-utils, which parses our own build-time Info.plist; no untrusted
    # input. Remove once tauri-utils upgrades plist/quick-xml.
    { id = "RUSTSEC-2026-0194", reason = "build-time plist parsing of trusted files only (tauri-utils)" },
    { id = "RUSTSEC-2026-0195", reason = "build-time plist parsing of trusted files only (tauri-utils)" },
]

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
