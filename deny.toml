[graph]
all-features = false

[licenses]
# Confidence threshold for license detection.
confidence-threshold = 0.8

# Anything not in this list is denied (GPL, AGPL, LGPL, SSPL, BUSL, etc.).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
# Warn on duplicate versions of the same crate.
multiple-versions = "warn"
# Deny wildcard dependencies.
wildcards = "deny"

[advisories]
# Deny crates with known security vulnerabilities.
ignore = []

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
