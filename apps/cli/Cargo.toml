[package]
name = "cli"
description = "Command-line interface binary (bot) for the Praxi-Bot agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bot"
path = "src/main.rs"

[features]
# `bot serve --fake-provider`: deterministic echo provider (tests, demos).
fake-provider = ["daemon-api/fake-provider"]

[dependencies]
live-view.workspace = true
peer-network = { path = "../../crates/peer-network", version = "0.1.0" }
remote-api = { path = "../../crates/remote-api", version = "0.1.0", features = ["server"] }
agent-core = { path = "../../crates/agent-core", version = "0.1.0" }
async-trait.workspace = true
agent-router = { path = "../../crates/agent-router", version = "0.1.0" }
channel-telegram = { path = "../../crates/channel-telegram", version = "0.1.0" }
connector-email = { path = "../../crates/connector-email", version = "0.1.0" }
builtin-tools = { path = "../../crates/builtin-tools", version = "0.1.0" }
browser-cdp = { path = "../../crates/browser-cdp", version = "0.1.0" }
mcp-bridge = { path = "../../crates/mcp-bridge", version = "0.1.0" }
fs4 = "1"
clap = { workspace = true, features = ["env"] }
daemon-api = { path = "../../crates/daemon-api", version = "0.1.0" }
desktop-api = { path = "../../crates/desktop-api", version = "0.1.0" }
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
parking_lot.workspace = true
permission-engine = { path = "../../crates/permission-engine", version = "0.1.0" }
futures-util.workspace = true
protocol.workspace = true
provider-catalog = { path = "../../crates/provider-catalog", version = "0.1.0" }
reqwest.workspace = true
secret-store.workspace = true
serde.workspace = true
serde_json.workspace = true
skills = { path = "../../crates/skills", version = "0.1.0" }
storage.workspace = true
tokio = { workspace = true, features = ["signal"] }
tool-registry = { path = "../../crates/tool-registry", version = "0.1.0" }
toml.workspace = true
url.workspace = true
web-tools = { path = "../../crates/web-tools", version = "0.1.0" }
workflow-replay = { path = "../../crates/workflow-replay", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
desktop-windows = { path = "../../crates/desktop-windows", version = "0.1.0" }

[dev-dependencies]
wiremock.workspace = true
daemon-api = { path = "../../crates/daemon-api", version = "0.1.0", features = ["fake-provider"] }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
