[package]
name = "cli"
description = "Command-line interface binary (bot) for the Praxi-Bot agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bot"
path = "src/main.rs"

[features]
# `bot serve --fake-provider`: deterministic echo provider (tests, demos).
fake-provider = ["daemon-api/fake-provider"]
local-embeddings = ["daemon-api/local-embeddings"]
# On-device speech-to-text (`stt_provider = "local_voice"`): Silero VAD + Whisper through sherpa-onnx.
# Off by default: the sherpa-onnx build script downloads the ONNX runtime for the build target.
local-voice = ["dep:sherpa-onnx", "dep:opus-decoder", "dep:ogg"]

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[dependencies]
support-logs = { path = "../../crates/support-logs", version = "0.1.0" }
sherpa-onnx = { version = "2", optional = true }
opus-decoder = { version = "0.1", optional = true }
ogg = { version = "0.9", optional = true }
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
semver = "1"
tempfile.workspace = true
live-view.workspace = true
host-provision = { path = "../../crates/host-provision", version = "0.1.0" }
peer-network = { path = "../../crates/peer-network", version = "0.1.0" }
state-bundle = { path = "../../crates/state-bundle", version = "0.1.0" }
remote-api = { path = "../../crates/remote-api", version = "0.1.0", features = ["server"] }
agent-core = { path = "../../crates/agent-core", version = "0.1.0" }
async-trait.workspace = true
agent-router = { path = "../../crates/agent-router", version = "0.1.0" }
channel-api = { path = "../../crates/channel-api", version = "0.1.0" }
channel-discord = { path = "../../crates/channel-discord", version = "0.1.0" }
channel-telegram = { path = "../../crates/channel-telegram", version = "0.1.0" }
connector-homeassistant = { path = "../../crates/connector-homeassistant", version = "0.1.0" }
connector-calendar = { path = "../../crates/connector-calendar", version = "0.1.0" }
connector-email = { path = "../../crates/connector-email", version = "0.1.0" }
builtin-tools = { path = "../../crates/builtin-tools", version = "0.1.0" }
computer-target = { path = "../../crates/computer-target", version = "0.1.0" }
browser-cdp = { path = "../../crates/browser-cdp", version = "0.1.0" }
assistant-import = { path = "../../crates/assistant-import", version = "0.1.0" }
mcp-bridge = { path = "../../crates/mcp-bridge", version = "0.1.0" }
openapi-tools = { path = "../../crates/openapi-tools", version = "0.1.0" }
composio = { path = "../../crates/composio", version = "0.1.0" }
fs4 = "1"
clap = { workspace = true, features = ["env"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
daemon-api = { path = "../../crates/daemon-api", version = "0.1.0" }
missions = { path = "../../crates/missions", version = "0.1.0" }
desktop-api = { path = "../../crates/desktop-api", version = "0.1.0" }
cli-provider.workspace = true
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
parking_lot.workspace = true
permission-engine = { path = "../../crates/permission-engine", version = "0.1.0" }
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
protocol.workspace = true
provider-catalog = { path = "../../crates/provider-catalog", version = "0.1.0" }
reqwest.workspace = true
zeroize = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
secret-store.workspace = true
serde.workspace = true
serde_json.workspace = true
process-guard = { path = "../../crates/process-guard", version = "0.1.0" }
skills = { path = "../../crates/skills", version = "0.1.0" }
storage.workspace = true
tokio = { workspace = true, features = ["signal", "io-std"] }
tool-registry = { path = "../../crates/tool-registry", version = "0.1.0" }
toml.workspace = true
base64.workspace = true
url.workspace = true
uuid.workspace = true
web-tools = { path = "../../crates/web-tools", version = "0.1.0" }
workflow-replay = { path = "../../crates/workflow-replay", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
desktop-windows = { path = "../../crates/desktop-windows", version = "0.1.0" }

[dev-dependencies]
serde_yaml = "0.9"
proptest.workspace = true
memory-store = { path = "../../crates/memory-store", version = "0.1.0" }
tokio = { workspace = true, features = ["test-util"] }
desktop-linux = { path = "../../crates/desktop-linux", version = "0.1.0" }
wiremock.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["client", "server", "transport-io"] }
daemon-api = { path = "../../crates/daemon-api", version = "0.1.0", features = ["fake-provider"] }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
desktop-linux = { path = "../../crates/desktop-linux", version = "0.1.0" }
rustix = { version = "1", features = ["net", "fs", "process"] }
