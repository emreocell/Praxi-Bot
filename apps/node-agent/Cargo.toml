[package]
name = "node-agent"
description = "Node-agent binary (bot-node) that runs on each controlled machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bot-node"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
desktop-api = { path = "../../crates/desktop-api", version = "0.1.0" }
peer-network = { path = "../../crates/peer-network", version = "0.1.0" }
storage.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
desktop-windows = { path = "../../crates/desktop-windows", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
desktop-linux = { path = "../../crates/desktop-linux", version = "0.1.0" }

[dev-dependencies]
desktop-linux = { path = "../../crates/desktop-linux", version = "0.1.0" }
